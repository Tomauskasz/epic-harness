# TDD — Test-Driven Development\r
\r
## Iron Law\r
\r
NO PRODUCTION CODE WITHOUT A FAILING TEST FIRST. Violating the letter of this process is violating the spirit of this process.\r
\r
## Process\r
\r
### Red → Green → Refactor\r
\r
1. **Red**: Write a failing test that describes the desired behavior\r
   - Test name should read like a spec: \`it("returns 401 when token is expired")\` (reason: the test name IS your specification — it must communicate intent to future readers)\r
   - Run the test — confirm it fails for the right reason (reason: a test that fails for the wrong reason gives false confidence)\r
\r
2. **Green**: Write the minimum code to make the test pass\r
   - Do not write more than needed — because premature optimization is the root of all evil; make it work first\r
   - Do not optimize yet — because optimization without a passing test is speculation, not engineering\r
   - Run the test — confirm it passes (reason: a passing test is the only proof the code works)\r
\r
3. **Refactor**: Clean up without changing behavior\r
   - Extract duplicates, rename for clarity, simplify — because readability matters more than cleverness\r
   - Run tests again — must still pass (reason: refactoring without re-running tests is just renaming bugs)\r
\r
### Cycle\r
Repeat for each behavior. One test, one behavior, one cycle — because scope creep in a single test cycle leads to unverified code.\r
\r
## When to Trigger\r
- \`/go\` subagents: always — because autonomous agents without TDD produce unverified code\r
- New function or method being written\r
- Bug fix (write regression test first — because a bug that happened once will happen again without a guard)\r
\r

\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|--------------------|\r
| "This is too simple for tests" | Simple code still breaks. The Beyonce Rule applies: if you liked it, you should have put a test on it. | Write the test anyway — it takes 30 seconds and catches edge cases. |\r
| "I'll write tests after" | That's documentation, not specification. Tests written after confirm what you built; tests written before define what you should build. | Write the test first. If you can't describe the behavior, you don't understand the requirement. |\r
| "Tests slow me down" | 15 minutes of TDD saves hours of debugging regression bugs later. | Time the cycle — Red-Green-Refactor is usually faster than debug-after-deploy. |\r
| "I'll just test manually" | Manual tests don't catch regressions. Automate it once, save hours forever. | Write an automated test that runs on every commit. |\r
| "The types guarantee correctness" | Types check shape, not logic. \`add(a,b)\` can still return \`a-b\`. | Write a test that verifies the actual business rule, not just the type signature. |\r
| "I need to see the API shape first" | Spike freely, then delete and rebuild test-first. A throwaway spike is research, not implementation. | Spike, discard, then TDD the real implementation from what you learned. |\r

\r

- [ ] Test covers behavior, not implementation (no mocking internals)\r
- [ ] Refactor step completed OR explicitly noted as unnecessary with reason\r
\r

\r
## Red Flags\r
- Writing implementation before any test exists\r
- Test that tests implementation details instead of behavior\r
- Skipping the refactor step\r
- Multiple behaviors in one test\r

# Threat Model — Attack Surface Analysis\r
\r
## Iron Law\r
\r
Every system has an attack surface. If you haven't identified it, you haven't secured it.\r
\r
## Process\r
\r
### Step 0: Load Engagement Context\r
\r
Check for \`.harness/engagement.md\` in the project root. If present, load the scope (in-scope/out-of-scope) and constraints. Skip threat modeling for explicitly out-of-scope components.\r
\r

\r
### Step 1: Identify Trust Boundaries\r
\r
Map every boundary where data crosses a trust level:\r
\r
1. **External → Internal**: API endpoints, webhooks, file uploads, user input\r
2. **Internal → Privileged**: DB queries, file system access, shell execution\r
3. **Service → Service**: Inter-service communication, message queues, shared state\r
4. **Client → Server**: Auth tokens, session state, CORS origins\r
\r
For each boundary, document:\r
- Data flow direction\r
- Input validation present (yes/no/partial)\r
- Authentication required (yes/no)\r
- Encryption in transit (yes/no)\r
\r
### Step 2: Enumerate Threat Actors\r
\r
| Actor | Motivation | Capability | Target |\r
|-------|-----------|------------|--------|\r
| Anonymous user | Exploration | Low | Public endpoints |\r
| Authenticated user | Data access | Medium | Own data + IDOR targets |\r
| Malicious insider | Data exfiltration | High | All internal systems |\r
| Compromised dependency | Supply chain | Variable | Build/deploy pipeline |\r
\r
### Step 3: Generate Threat Scenarios\r
\r
For each trust boundary × threat actor combination, generate:\r
\r
1. **Attack vector**: How the boundary is crossed maliciously\r
2. **Impact**: What is compromised (CIA triad — Confidentiality, Integrity, Availability)\r
3. **Likelihood**: High/Medium/Low based on exposure and complexity\r
4. **Existing mitigations**: What already prevents this\r
5. **Gap**: What is missing\r
\r
### Step 4: Produce Output\r
\r
Write \`THREAT_MODEL.md\`:\r
\r
\`\`\`markdown\r
# Threat Model — {project}\r
\r
## Scope\r
- In-scope: {from engagement.md or full codebase}\r
- Out-of-scope: {from engagement.md or none}\r
- Date: {ISO date}\r
\r
## Trust Boundaries\r
| # | Boundary | Direction | Validation | Auth | Encryption |\r
|---|----------|-----------|------------|------|------------|\r
| 1 | ... | ... | ... | ... | ... |\r
\r
## Threat Scenarios\r
| ID | Boundary | Actor | Vector | Impact | Likelihood | Mitigated | Gap |\r
|----|----------|-------|--------|--------|------------|-----------|-----|\r
| T1 | ... | ... | ... | ... | ... | Partial | ... |\r
\r
## Priority Remediation\r
1. [CRITICAL] {highest risk gap}\r
2. [HIGH] {next gap}\r
3. [MEDIUM] {remaining gaps}\r
\r
## Assumptions\r
- {list all assumptions made during analysis}\r
\`\`\`\r
\r
### Step 5: Feed into vuln-scan\r
\r
After producing the threat model, suggest:\r
**"Run \`/vuln-scan\` to validate threat scenarios against the codebase."**\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "We don't have any external-facing components" | Internal trust boundaries are attack surfaces too. Lateral movement starts inside. | Model internal boundaries with the same rigor. |\r
| "Threat modeling is overkill for a small project" | Small projects get breached too. The model is proportional to the codebase. | Run the process. It takes 10 minutes. A breach takes months. |\r
| "We already have a threat model" | Threat models expire. Every code change can invalidate assumptions. | Update the model when significant changes land. |\r

\r

\r

- [ ] At least 2 threat scenarios per boundary\r

- [ ] Assumptions explicitly listed (not hidden)\r
\r
## Red Flags\r
\r
- Skipping boundaries because they're "internal"\r
- Listing only one threat scenario per boundary\r
- Marking all scenarios as "already mitigated" without evidence\r
- No assumptions section — means assumptions are hidden, not absent\r

# Triage — Adversarial Vulnerability Validation\r
\r
## Iron Law\r
\r
A vulnerability finding is not confirmed until an adversary would agree it's exploitable. Unvalidated findings are noise.\r
\r
## Process\r
\r
### Step 0: Load Inputs\r
\r
Required inputs (in order of preference):\r
1. \`VULN-FINDINGS.json\` from \`/vuln-scan\`\r
2. Raw findings from \`/audit --security\`\r
3. User-provided finding list\r
\r
Optional:\r
- \`THREAT_MODEL.md\` for threat scenario context\r
- \`.harness/engagement.md\` for scope constraints\r
\r
If no findings input exists, suggest:\r
**"Run \`/vuln-scan\` first to generate findings to triage."**\r
\r
### Step 1: Adversarial Review\r
\r
For each finding, challenge it from an attacker's perspective:\r
\r
#### Exploitability Check\r
1. **Can input reach the vulnerable code?** Trace the data flow from entry point to vulnerability.\r
2. **Can the attacker control the input?** Distinguish between user-controlled vs. system-generated data.\r
3. **Is there a path to impact?** Connecting the vulnerability to a security consequence (data leak, code exec, DoS).\r
4. **Are there bypasses for existing mitigations?** WAF, input validation, CSP — all have bypass techniques.\r
\r
#### Severity Validation\r
| Criteria | Adjust |\r
|----------|--------|\r
| Requires authentication | Lower by 1 level |\r
| Requires specific permissions | Lower by 1 level |\r
| Chained with another finding | Raise by 1 level |\r
| Affects all users | Raise by 1 level |\r
| No mitigation in place | Raise by 1 level |\r
| Defense-in-depth exists | Lower by 1 level |\r
\r
#### Classification\r
| Class | Meaning |\r
|-------|---------|\r
| \`CONFIRMED\` | Exploitable with demonstrated path |\r
| \`LIKELY\` | Exploitable with high confidence, minor gaps in proof |\r
| \`POSSIBLE\` | Theoretical, needs more investigation |\r
| \`FALSE_POSITIVE\` | Not exploitable with justification |\r
| \`ACCEPTED_RISK\` | Known, documented, accepted by team |\r
\r
### Step 2: Dependency Analysis\r
\r
Check if findings chain together:\r
\r
1. **Find pairs** where finding A enables finding B (e.g., IDOR → data exposure)\r
2. **Mark chains** — chained findings are more severe than individual findings\r
3. **Identify root causes** — multiple findings from the same root cause should be grouped\r
\r
### Step 3: Produce Output\r
\r
Write \`TRIAGE.json\`:\r
\r

  "source": "VULN-FINDINGS.json | audit | manual",\r
  "findings": [\r

      "classification": "CONFIRMED | LIKELY | POSSIBLE | FALSE_POSITIVE | ACCEPTED_RISK",\r
      "original_severity": "CRITICAL",\r
      "adjusted_severity": "HIGH",\r
      "severity_adjustments": ["requires auth (-1)", "no mitigation (+1)"],\r
      "exploit_path": ["entry point → vulnerable function → impact"],\r
      "chains_with": ["V3"],\r
      "root_cause_group": "RC1",\r
      "remediation": "specific fix instruction",\r
      "effort": "low | medium | high",\r
      "validation_notes": "why this classification was chosen"\r
    }\r
  ],\r
  "root_cause_groups": [\r
    {\r
      "id": "RC1",\r
      "description": "shared root cause",\r
      "findings": ["V1", "V2"],\r
      "fix_once": "single fix that resolves all findings in group"\r
    }\r
  ],\r
  "chains": [\r
    {\r
      "findings": ["V1", "V3"],\r
      "combined_severity": "CRITICAL",\r
      "description": "V1 enables V3, creating..."\r
    }\r
  ],\r
  "summary": {\r
    "total_input": 10,\r
    "confirmed": 3,\r
    "likely": 2,\r
    "possible": 1,\r
    "false_positive": 2,\r
    "accepted_risk": 2,\r
    "root_cause_groups": 3,\r
    "chains": 1\r
  },\r
  "action_items": [\r
    {\r
      "priority": 1,\r
      "severity": "CRITICAL",\r
      "finding_ids": ["V1"],\r
      "action": "specific remediation step",\r
      "effort": "low"\r
    }\r
  ]\r
}\r
\`\`\`\r
\r
### Step 4: Report\r
\r
Present prioritized remediation plan:\r
\r
\`\`\`\r
## Triage Report\r
\r
### Summary\r
- Input: N findings\r
- Confirmed: X | Likely: Y | False positives: Z\r
- Root cause groups: K (fix-once opportunities)\r
- Chained findings: C\r
\r
### Priority Actions\r
1. [CRITICAL] V1: {description} — {effort} effort\r
   Fix: {remediation}\r
2. [HIGH] V2+V3 (chain): {description} — {effort} effort\r
   Fix: {remediation}\r
\r
### Accepted Risks\r
- V7: {description} — {justification}\r
\r
### Suggested Next Steps\r
- Fix priority 1-3 before merge\r
- Run \`/vuln-scan\` after fixes to verify\r
\`\`\`\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "All findings are real, no need to triage" | False positives waste fix time and erode trust in the process. | Validate every finding. Noise reduces signal. |\r
| "Triaging takes too long" | Fixing false positives takes longer than triaging them. | Triage first, fix only confirmed findings. |\r
| "It's obviously a vulnerability" | "Obvious" vulnerabilities are often mitigated by context you haven't checked. | Trace the exploit path before confirming. |\r
| "We can just fix them all" | Not all findings need fixing. Some are accepted risks. | Prioritize by confirmed severity and effort. |\r

\r

\r
- All findings marked CONFIRMED without exploit paths\r
- All findings marked FALSE_POSITIVE without justification\r
- No severity adjustments — original severity is almost never perfect\r
- Ignoring finding chains — individual severity ≠ chain severity\r
- Skipping dependency analysis between findings\r
- TRIAGE.json action items not ordered by priority\r

\r
# Vuln Scan — Systematic Vulnerability Scanner\r
\r
## Iron Law\r
\r
Code you haven't traced from input to sink has vulnerabilities you haven't found. A grep hit is a lead, not a finding.\r
\r
## Process\r
\r
### Step 0: Load Engagement Context\r
\r
Check for \`.harness/engagement.md\`. If present, load scope constraints — only scan in-scope paths and respect exclusions.\r
\r
Check for \`THREAT_MODEL.md\` from a previous \`/threat-model\` run. If present, use its threat scenarios as scan targets. If absent, run full-surface scan.\r
\r
### Step 1: Map Entry Points to Trust Boundaries\r
\r
Enumerate every place untrusted data enters the system, by reading the code:\r
\r
- **External → app**: HTTP handlers/routers, GraphQL resolvers, webhooks, file uploads, form fields, query params, headers\r
- **Process boundary**: CLI args, environment variables, IPC, deserialization of stored data (cache, DB rows written earlier, config files)\r
- **Client-supplied state**: cookies, JWT claims, API keys, referer/origin\r
\r
For each entry point, note: what validation exists (yes/no/partial), and where the data flows next. This list is the scan's backbone — a scan that cannot name its entry points has not started.\r
\r
### Step 2: Trace Data Flow to Sinks\r
\r
From each entry point, follow the data by reading code until it reaches a dangerous operation, or dies (validated, parameterized, dropped). Dangerous sink classes:\r
\r
| Sink class | Examples (non-exhaustive) |\r
|-----------|--------------------------|\r
| Command/code execution | shell invocation, \`eval\`-family, template engines with code modes, deserialization to live objects |\r
| Query construction | string-built SQL, raw-query escapes in any ORM (Knex \`raw\`, Prisma \`$queryRaw\`, SQLAlchemy \`text()\`, Sequelize \`literal\`, Django \`extra\`/\`raw\`, Rails \`where("...")\` with interpolation) |\r
| Filesystem | path joins with user input, upload destinations, archive extraction (zip-slip), file reads driven by request params |\r
| Web output | template rendering with non-auto-escaping engines, \`innerHTML\`-family, redirect targets, header values (CRLF) |\r
| Auth decisions | IDOR — object lookups keyed only on user-supplied ids without ownership checks; role checks done client-side or per-endpoint instead of per-object |\r
\r
Read the surrounding code for every candidate sink. A sink that only receives validated/parameterized data is not a finding; a sink reachable from an entry point with no validation is.\r
\r
### Step 3: Reason About Encoding and Context at Each Sink\r
\r
For each reachable sink, ask what context the data lands in and whether the encoding matches:\r
\r
- Interpolated into a SQL string? → parameterize, don't escape\r
- Interpolated into a shell string? → arg-array execution, don't quote\r
- Rendered into HTML/JS/CSS/URL? → each needs context-specific output encoding; auto-escaping templates cover HTML only when actually enabled for that template\r
- Joined into a path? → canonicalize, then verify containment inside the intended root\r
- Deserialized? → prefer format + type that cannot instantiate attacker-chosen types\r
\r
### Step 4: Auth & Data-Exposure Pass\r
\r
- **Default-deny**: routes/actions missing an auth middleware or check entirely — enumerate handlers and look for the gaps, not the checks\r
- **Object-level authorization**: for each handler that reads/writes a user-owned object, is ownership verified on THIS request?\r
- **Secrets**: hardcoded credentials vs. config/env references; secrets in logs, error messages, client bundles, API responses\r
- **Error leakage**: verbose errors/stack traces/config in production paths; error messages that distinguish "no such user" from "wrong password"\r
\r
### Step 5: Dependency Pass\r
\r
\`\`\`bash\r
cargo audit 2>/dev/null || echo "cargo-audit not installed"   # Rust\r
npm audit 2>/dev/null || echo "npm audit not available"       # Node.js\r
\`\`\`\r
\r
For each advisory: is a fix available, and is the vulnerable code path actually reachable from this codebase's usage? Unreachable advisories are LOW/INFO, not silent drops. Also flag actively-used dependencies that are unmaintained (no release in ~2+ years, archived repo) even without a CVE.\r
\r
### Grep as Accelerator, Not Oracle\r
\r
Grep is fine for *candidate* sink locations (\`raw(\`, \`exec\`, \`innerHTML\`, \`eval\`, secret-ish identifiers) — use it to shortlist where to read. It misses framework-specific sinks, aliases, and data built across files. Never report a finding from a grep hit alone; never conclude "clean" because grep found nothing.\r
\r
### Step 6: Produce Output\r
\r
Write \`VULN-FINDINGS.json\`:\r
\r
\`\`\`json\r
{\r
  "scan_date": "ISO-8601",\r
  "scope": "full | incremental",\r
  "threat_model_ref": "THREAT_MODEL.md | null",\r
  "entry_points_traced": ["list every entry point examined — required for clean scans"],\r
  "findings": [\r
    {\r
      "id": "V1",\r
      "dimension": "injection | auth | exposure | dependency",\r
      "severity": "CRITICAL | HIGH | MEDIUM | LOW | INFO",\r
      "file": "path/to/file",\r
      "line": 42,\r
      "source": "untrusted-input origin (entry point)",\r
      "sink_chain": ["entry function", "...", "sink function"],\r
      "description": "what was found",\r
      "validated": true,\r
      "false_positive": false,\r
      "reachable": true,\r
      "mitigated": false,\r
      "threat_scenario": "T1 | null",\r
      "remediation": "one-line fix hint"\r
    }\r
  ],\r
  "summary": {\r
    "total": 10,\r
    "critical": 1,\r
    "high": 3,\r
    "medium": 4,\r
    "low": 2,\r
    "false_positives": 0\r
  }\r
}\r
\`\`\`\r
\r
### Step 7: Feed into Triage\r
\r
After producing findings, suggest:\r
**"Run \`/triage\` to validate findings with adversarial review."**\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "It's an internal tool / not user-facing" | Internal boundaries are attack surfaces — lateral movement starts inside. | Trace internal entry points with the same rigor. |\r
| "The framework sanitizes automatically" | Auto-escaping and parameterization have opt-outs, raw escapes, and edges; business logic is framework-agnostic. | Find the raw/dangerous escapes and read them. |\r
| "We'll add validation later" | Later never arrives for paths that already work. | Finding = now; remediation line goes in the output. |\r
| "Grep found nothing, so we're clean" | Grep misses aliased and framework-specific sinks by construction. | A clean claim requires traced entry points, not an empty grep. |\r
| "Dependencies are vetted" | Transitive dependencies aren't. | Run the dependency pass every time the lockfile changes. |\r
\r
## Evidence Required\r
\r
- [ ] Every finding cites file:line + the untrusted-input origin + the sink call chain\r
- [ ] Each finding validated: reachable, not mitigated, severity confirmed\r
- [ ] A clean (or low-finding) scan lists \`entry_points_traced\` — absence of evidence is not evidence of absence\r
- [ ] All 4 dimensions completed (injection, auth, exposure, dependency)\r
- [ ] VULN-FINDINGS.json written with summary\r
- [ ] If THREAT_MODEL.md exists: each threat scenario mapped to findings\r
- [ ] No CRITICAL/HIGH finding dismissed without explicit justification\r
\r
## Red Flags\r
\r
- Reporting grep hits without reading the surrounding code\r
- Skipping framework-specific sink types (ORM raw escapes, non-auto-escaping templates)\r
- Claiming clean without naming which entry points were traced\r
- Scanning only changed files when full-surface scan was requested\r
- Marking findings as false positives without a traced reason\r
- VULN-FINDINGS.json with zero findings on a non-trivial codebase — the scan was likely incomplete, not the codebase clean\r
