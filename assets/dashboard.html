name: _critic\r
description: "HarnessX Critic (Tier 2.1) — adversarial review of evolved-skill proposals against trace evidence. Detects reward hacking and manifest/evidence contradictions. Out-of-band LLM counterpart to the in-loop deterministic critic in src/evolve/critic.rs."\r
---\r
\r
# Critic — Adversarial Proposal Review\r
\r
> **In-loop vs out-of-band.** epic-harness forbids external LLM calls from\r
> production, so the reflect loop ships a **deterministic** critic\r
> (\`src/evolve/critic.rs\`) that gates seeding when reward hacking is\r
> suspected. THIS skill is the **out-of-band LLM** version a meta-agent or\r
> human runs during \`/evolve\` review for the cases the deterministic check\r
> cannot catch (non-local effects, manifest/evidence nuance).\r
\r
## When to Trigger\r
- During \`/evolve\` review of newly seeded skills\r
- When \`reward_hacking_suspected\` is true in metrics\r
- After a seesaw-regression round, before re-proposing\r
\r
## Process\r
\r
### 1. Gather the proposal + evidence\r
- Read the evolved skill proposal(s) from this round\r
- Read the EditManifest (edit_type, target, intended_effect, predicted_impact)\r
- Read the round's TaskDigests (outcome, failure_categories, evidence_excerpts)\r
- Read recent score_history dimension_averages (tool_success, output_quality, execution_cost)\r
\r
### 2. Falsify the manifest (paper §4.3, Table 9)\r
For each proposal, ask: does the trace evidence support the \`predicted_impact\`?\r
- If the manifest claims "Lift avg_score_with" but output_quality is regressing → **Reject**\r
- If the manifest claims a tool fix but the implicated component shows no change → **Warn**\r
- If the evidence corroborates the predicted effect → **Approve**\r
\r
### 3. Reward-hacking cross-check\r
- Is execution_cost rising while output_quality falls across the window?\r
- Could the skill be gaming a metric (fewer tool calls inflating cost score) rather than improving outcomes?\r
- If yes, the skill must NOT ship — flag for the rejected buffer.\r
\r
### 4. Non-local effect scan\r
- Will this skill's guard rules conflict with existing skills (overlapping triggers, contradictory rules)?\r
- Does it interact with shared state (context, memory, control) in a way the manifest didn't account for?\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | Do instead |\r
|--------|----------|------------|\r
| "The score went up, so it works" | Score can rise via metric gaming | Verify the *outcome* improved, not just the score |\r
| "The seesaw passed, it's safe" | Seesaw is coarse; sub-threshold coupling evades it | Check dimension deltas, not just aggregate pass |\r
| "It's just a prompt tweak" | Prompt edits have non-local effects on shared context | Trace the effect across skills, not just the target |\r
\r
## Evidence Required\r
- [ ] Manifest's predicted_impact checked against observed dimension deltas\r
- [ ] reward_hacking_suspected consulted\r
- [ ] No conflict with ≥1 existing skill demonstrated\r
- [ ] Verdict (Approve/Warn/Reject) recorded per proposal with reason\r
\r
## Red Flags\r
- Approving a skill whose only evidence is "score went up"\r
- Ignoring a falling output_quality because execution_cost rose\r
- Shipping after a seesaw-regression round without explicit justification\r
- Treating the deterministic critic as sufficient for non-local effects (it is not — it only checks reward hacking + score-claim contradiction)\r

## Project Overrides (load before dispatching)\r
\r
Teams commit their own conventions beside the code so every host and every engineer inherits them on pull. Resolution order, highest wins:\r
\r
| Priority | File | Scope |\r
|---|---|---|\r
| 1 | \`.epic/team.local.md\` | personal, gitignored |\r
| 2 | \`.epic/team.md\` | team, committed |\r
| 3 | shipped skill defaults | base |\r
\r
At session start and before any pipeline skill (\`spec\`, \`go\`, \`audit\`, \`ship\`, \`orbit\`), read whichever of these exist and treat each bullet as a standing fact for the rest of the session. Facts are plain markdown bullets; a bullet of the form \`file: {path}\` means load that file too. Skill-specific sections use a heading equal to the skill name (\`## spec\`, \`## go\`, ...) and apply only inside that skill. Absence of \`.epic/\` is normal; never create it unprompted. Never write harness state into \`.epic/\`; state lives in \`$HARNESS_DIR\`.\r
\r
## Dispatch Rules\r
\r
| Context Signal | Invoke Skill |\r
|----------------|-------------|\r
| New feature implementation starting | **tdd** |\r
| Test failure, error, or unexpected behavior | **debug** |\r
| Auth, DB, API, infra, or secrets code touched | **secure** |\r
| Loops, queries, rendering, or data processing code | **perf** |\r
| File > 500 lines, nesting > 3 levels, or copy-paste blocks | **simplify** |\r
| Public API/function added or changed | **document** |\r
| Before completing /go or /ship | **verify** |\r
| User wants to commit changes | **commit** |\r
| Before or during context compaction (working-state snapshot) | **context** |\r
| User request is vague, unfocused, or presents a solution without a clear problem | **discover** |\r
| User invokes \`/reflect\`, asks about AI usage quality, "am I using AI well", "thought amplifier", or requests AI usage self-assessment | **reflect** |\r
| Orchestration run active (\`$HARNESS_DIR/orchestrator/run.json\` exists with status "running") | **orchestrate** |\r
| Agent tool output received with inter-agent message | **orchestrate** |\r
| User runs \`/intervene\` | **orchestrate** |\r
| 요구사항 정의 필요, 스펙 없음 | **spec** |\r
| 빌드/구현 시작, 스펙 승인됨 | **go** |\r
| 리뷰/감사/테스트 필요 | **audit** |\r
| PR 생성 / CI / 배포 준비 | **ship** |\r
\r
## Alias Routing\r
\r
Users can still type legacy command names. Map them:\r
- \`/spec\` → invoke skill **spec** directly\r
- \`/go\` → invoke skill **go** directly\r
- \`/audit\` → invoke skill **audit** directly\r
- \`/ship\` → invoke skill **ship** directly\r
- \`/discover\` → invoke skill **discover** directly\r
- \`/intervene\` → invoke skill **orchestrate** (intervene mode)\r
- \`/status\` → invoke skill **orchestrate** (status mode)\r
\r
## Loop Transition Signals\r
\r
When a phase completes, prompt the user toward the next step. Do NOT auto-proceed — surface the transition explicitly.\r
\r
| Phase completed | Condition | Prompt to user |\r
|----------------|-----------|----------------|\r
| \`/discover\` problem framed | \`status: framed\` written | "Problem defined. Run \`/spec\` to turn this into a buildable specification." |\r
| \`/spec\` saved | \`status: approved\` written | "Spec saved. Run \`/go\` to start building." |\r
| \`/go\` report done | All tasks complete, tests green | "Build complete. Run \`/audit\` to verify before shipping." |\r
| \`/audit\` report done | All PASS + all AC verified | "Audit passed. Run \`/ship\` to create a PR." |\r
| \`/audit\` report done | Any FAIL or AC missing | "Fix blockers with \`/go\`, then re-run \`/audit\`." |\r
| \`/ship\` report done | PR created, CI green | "Shipped. Loop complete." |\r
| \`/orbit\` phase done | Pipeline \`status: running\` | "(orbit) Phase complete. Continuing to next phase..." |\r
| \`/orbit\` audit FAIL × 3 | \`audit_fail_count >= max_retries\` | "(orbit) 3 audit failures reached. Pausing for your input." |\r
| \`/orbit\` complete | PR created, CI green | "(orbit) Pipeline complete. See consolidated report above." |\r
| \`/intervene\` executed | Control directive written | "Intervention recorded. Use /status to monitor." |\r
\r
These transitions are informational nudges only. The user controls when each phase runs.\r
\r
## Orbit Mode Override\r
\r
When \`/orbit\` is active (detected by: \`$HARNESS_DIR/orbit/PIPELINE-*.json\` exists with \`status: running\`):\r
\r
- **SUPPRESS** normal phase transition prompts ("Run \`/go\`", "Run \`/audit\`", "Run \`/ship\`", etc.) — orbit handles its own phase transitions internally\r
- **Dispatch skills normally** — tdd, debug, verify, secure, perf, simplify, document, context all fire as usual within each phase\r
- **After orbit completes** (\`status: complete\` or \`status: aborted\`) — resume normal dispatch behavior\r
\r
**Orbit Recovery on Session Resume**: On a \`PIPELINE-*.json\` with \`status: running\`, follow the **Phase Recovery Protocol** in \`skills/orbit/SKILL.md\` — do not re-run mode selection or spec creation.\r
\r
The orbit command is a self-contained pipeline. Interjecting normal transition nudges during orbit would confuse the user.\r
\r
## Confusion Protocol\r
\r
When you encounter high-risk ambiguity, you MUST stop and present options instead of guessing.\r
\r
**High-risk ambiguity triggers:**\r
- Architecture decisions (choosing between patterns, frameworks, or approaches)\r
- Data model changes (schema modifications, new tables, migration strategy)\r
- Destructive scope (deleting features, breaking API changes, removing code)\r
- Cross-cutting concerns that affect multiple modules\r
\r
**Protocol:**\r
1. STOP — do not proceed with any implementation\r
2. STATE — clearly describe the ambiguity in one sentence\r
3. OPTIONS — present 2-3 concrete options with trade-offs\r
4. ASK — wait for user decision before continuing\r
\r
**Example:**\r
> AMBIGUITY: You asked to "fix the auth flow" but this could mean:\r
> A) Fix the token refresh bug in the existing JWT flow (surgical, 30 min)\r
> B) Migrate from JWT to session-based auth (architectural, 2 days)\r
> C) Add MFA to the existing flow (additive, 1 day)\r
> Which approach do you want?\r
\r
NEVER guess the scope of an ambiguous request. 2 minutes of clarification saves 2 hours of rework.\r
\r
## Priority\r
\r
1. **User's explicit instructions** — highest priority\r
2. **Skill directives** — override defaults\r
3. **Default behavior** — lowest priority\r
\r
If a user says "skip tests", respect that. Skills guide, users decide.\r
\r
## Dispatch Logging\r
\r
Log actual skill invocations for evolution analysis. Native hook records already\r
describe selection and context delivery; do not label those as executed skills.\r
For a skill the agent actually invokes, record a separate metadata-only event:\r
\r
1. Create \`$HARNESS_DIR/dispatch/dispatch_YYYYMMDD.jsonl\` if it doesn't exist\r
2. Append a JSON line: \`{ "timestamp": "<ISO>", "source": "agent_skill", "trigger_signal": "task_category", "selected_skills": ["<skill1>", ...], "action": "invoked" }\`\r
3. Use fixed trigger categories (\`explicit\`, \`task_category\`, \`error\`, \`pipeline\`).\r
   Never log raw prompts, task hints, secrets, memory titles/bodies, session IDs or\r
   personal paths. Skill names must come from the known skill catalog.\r
\r
This enables Ring 3 to analyze which skills fire most often, which are effective, and tune dispatch rules accordingly.\r
\r
## Memory-Augmented Dispatch\r
\r
Before invoking any skill, **proactively recall** relevant knowledge from the memory graph:\r
\r
If the native prompt hook already delivered relevant task memories, reuse them.\r
Recall again when the task hint changes, an error appears or more detail is needed.\r
\r
1. **At task start**: Run \`epic mem recall "<task hint>"\` (e.g., "auth refactor", "CI pipeline fix"). This returns relevance-ranked memories combining FTS match, importance, recency, access frequency, and graph connectivity.\r
2. **On errors**: Run \`epic mem recall\` with the error category/message as hint. Past resolutions and patterns for similar errors surface automatically.\r
3. **On architectural decisions**: Run \`epic mem recall\` with the domain area. Past \`decision\` nodes (importance=0.9) rank highest and prevent contradictory choices.\r
4. **After resolution**: Record via \`epic mem add\` with type \`resolution\` (auto-importance=0.8) or \`decision\` (auto-importance=0.9). These high-importance nodes persist across sessions and resist decay.\r
5. **Fallback**: If \`epic mem recall\` is unavailable, use \`epic mem search\` (keyword FTS) or \`epic mem context\` (project-scoped smart recall).\r
\r
Memory scoring: recency(25%) + importance(35%) + access_freq(15%) + FTS_match(25%). Frequently accessed and important memories naturally float to the top; unused noise decays over time.\r
\r
This enables cross-session learning: the agent remembers past mistakes, decisions, and solutions — and retrieves the most relevant ones for the current context.\r
\r
## Evolved Skills\r
\r
Evolved skills are generated by the Ring 3 evolution loop from actual failure patterns and are **injected automatically at session start** by the \`epic resume\` hook — their content appears in your context under the heading "Evolved Skills (epic-harness Ring 3)". You do NOT need to scan \`$HARNESS_DIR/evolved/\` yourself.\r
\r
### Rules:\r
\r
1. Apply injected evolved skills when the current context matches their guidance\r
2. Do NOT read skills from \`$HARNESS_DIR/evolved/\` that were not injected — non-injected skills are on **holdout rotation** (A/B baseline measurement); reading them corrupts the effectiveness measurement\r
3. If an evolved skill overlaps with a static skill (tdd, debug, secure, etc.), the **static skill takes priority** — evolved skills are supplements, not overrides\r
\r
### Evolved skill naming convention:\r
- \`evo-{pattern_type}\` — from failure pattern detection (e.g., \`evo-fix_then_break\`, \`evo-repeated_same_error\`)\r
- \`evo-{tool}-discipline\` — from weak tool category (e.g., \`evo-bash-discipline\`)\r
- \`evo-{ext}-care\` — from weak file type (e.g., \`evo-ts-care\`)\r
- \`evo-fix-{error}\` — from high-frequency error (e.g., \`evo-fix-build-fail\`)\r
\r
### When evolved skills are present, it means:\r
- The evolution loop detected a real weakness in past sessions\r
- Following the evolved skill's guidance should prevent repeat failures\r
- If an evolved skill's advice conflicts with a static skill, **prefer the static skill** — evolved skills supplement, static skills are authoritative\r

name: agent-introspection\r
description: "Loop-breaking self-diagnosis. Use when 3+ consecutive failures occur, circular retries persist, or context overwhelms the session."\r
---\r
\r
# Agent Introspection — Systematic Self-Diagnosis\r
\r
## Iron Law\r
NO UNSUPPORTED SELF-HEALING CLAIMS. Only assert recovery actions you can actually perform with available tools.\r
\r
## When to Trigger\r
- 3+ consecutive failures on the same task\r
- Repeating the same approach with different parameters (loop detection)\r
- Context window exceeds 70% without resolution\r
- Error messages repeat with no progress\r
- User explicitly says "you're stuck" or "try a different approach"\r
\r
## Process\r
\r
### 1. Failure Capture\r
Stop immediately and record:\r
- **Error type**: syntax_error / type_error / test_fail / lint_fail / build_fail / runtime_error / permission_denied / not_found\r
- **Last 3 tool calls**: what was attempted and what failed\r
- **Context pressure**: approximate context usage percentage\r
- **What changed**: what was the last successful state\r
\r
### 2. Root Cause Diagnosis\r
Match against known patterns:\r
\r
| Pattern | Symptoms | Root Cause |\r
|---------|----------|------------|\r
| **Loop trap** | Same error 3+ times | Wrong approach, not wrong parameters |\r
| **Context overflow** | Increasingly confused responses | Too much information, need compaction |\r
| **Environment drift** | "Works locally" failures | Missing env var, different tool version |\r
| **Cascade failure** | Fix A breaks B | Underlying assumption is wrong |\r
| **Tool mismatch** | Wrong tool for the job | Need a different approach entirely |\r
\r
### 3. Controlled Recovery\r
Execute ONLY the smallest safe action:\r
- **Loop trap** → Abandon current approach entirely. Try a fundamentally different strategy.\r
- **Context overflow** → Run \`/compact\` or summarize current state, then continue.\r
- **Environment drift** → Verify environment with explicit checks (\`which\`, \`--version\`).\r
- **Cascade failure** → Revert to last known good state. Re-analyze assumptions.\r
- **Tool mismatch** → Switch tools. If \`Edit\` fails 3 times, try \`Write\`. If \`Bash\` fails, try \`Read\` first.\r
\r
### 4. Introspection Report\r
Generate a structured report:\r
\`\`\`markdown\r
## Introspection Report\r
- **Failure type**: [type]\r
- **Root cause**: [diagnosis]\r
- **Recovery action**: [what was done]\r
- **Confidence**: [high/medium/low]\r
- **Next step**: [what to do if this happens again]\r
\`\`\`\r
\r
Save to memory:\r
\`\`\`bash\r
epic mem add \\\r
  --title "Self-diagnosis: {error_type} in {file}" \\\r
  --type error \\\r
  --body "Pattern: ...\\nRoot cause: ...\\nRecovery: ...\\n"\r
\`\`\`\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "One more try might work" | 3 failures means the approach is wrong, not unlucky. | Stop and run the full 4-step introspection process. |\r
| "I just need to tweak the parameters" | Tweaking a failing approach is not debugging. Step back and reassess. | Abandon the current approach and try a fundamentally different strategy. |\r
| "I can fix this myself" | Asking for help is not weakness. Escalation saves everyone time. | Escalate to the user with a clear summary of what was tried and what failed. |\r
| "The error is clear, I know the fix" | You said that 3 times already. Prove it with a different approach. | Run the introspection report and verify the fix with a test before claiming success. |\r
\r
## Evidence Required\r
\r
- [ ] Failure type classified correctly\r
- [ ] Root cause matched to known pattern\r
- [ ] Recovery action is the smallest safe action\r
- [ ] Introspection report generated\r
- [ ] Failure pattern recorded in memory\r
\r
## Red Flags\r
- Trying the same command more than 3 times with minor variations\r
- Claiming "fixed!" without running the actual test\r
- Not recording the failure pattern in memory\r
- Continuing after 70% context usage without compacting\r
`,hf=`---\r
name: audit\r
description: "Audit phase. Parallel review: code quality + security + tests. Semantic dedup of cross-mode findings. Outputs PASS/WARN/FAIL per dimension. Validates spec coverage."\r
---\r
\r
# Audit — Verify Everything\r
\r
**CRITICAL**: Run \`HARNESS_DIR=$(epic path)\` first. NEVER use \`.harness/\` in the project directory.\r
\r
## Execution Modes\r
\r
This skill has 3 internal modes that run in parallel:\r
\r
1. **audit:code** — Code quality, logic, style, test coverage, spec coverage\r
2. **audit:security** — OWASP Top 10 + performance (N+1, leaks)\r
3. **audit:test** — Full test suite, AC verification, coverage delta\r
\r
### \`--strict\` Mode (Trust Boundary Isolation)\r
\r
When invoked with \`--strict\` (or when \`.harness/engagement.md\` has \`mode: strict\`), the audit enforces independence between verification agents to prevent reward hacking:\r
\r
- **Artifact-only delivery**: Each mode receives only the code diff and spec — no builder context, no session history, no prior agent conclusions.\r
- **Cross-check independence**: \`audit:code\` and \`audit:security\` run without visibility into each other's findings. Results are combined only during synthesis (Step 4).\r
- **Blind scoring**: No mode can see another mode's verdict until synthesis. This prevents anchoring bias where a clean code review inflates the security score.\r
- **No self-review**: If the same agent built the code (via \`/go\`), a different agent instance must run audit. The builder's session ID is checked and excluded.\r
\r
Use \`--strict\` for security-sensitive projects, compliance requirements, or when the build phase had ambiguous outcomes.\r
\r
---\r
\r
## Process\r
\r
### Step 0: Prerequisites\r
\r
Confirm go has run:\r
\`\`\`bash\r
git symbolic-ref --short HEAD  # must NOT be main/master\r
\`\`\`\r
\r
Load the spec to know what was supposed to be built:\r
\`\`\`bash\r
ls -t $HARNESS_DIR/specs/SPEC-*.md | head -1\r
\`\`\`\r
Read the Requirements and Acceptance Criteria sections.\r
\r
### Step 1: Gather Scope\r
\r
\`\`\`bash\r
git diff --stat $(git merge-base HEAD main)\r
git diff --name-only $(git merge-base HEAD main)\r
git diff --numstat $(git merge-base HEAD main)\r
\`\`\`\r
\r
**Over-edit signal.** From \`--numstat\`, flag any file whose added+removed lines exceed 100 while the spec has 2 or fewer Requirements, or any file the spec never mentions. Flagged files get the Diff minimality check in audit:code. Typical cause: a formatter the project never adopted rewrote the whole file (quote style, line wrapping, import splitting).\r
\r
### Step 2: Scope Detection\r
\r
| Pattern | Scope | Extra checks |\r
|---------|-------|-------------|\r
| \`*.api.*\`, \`*route*\`, \`*controller*\`, \`*handler*\` | API | + Contract testing, request validation |\r
| \`*.tsx\`, \`*.jsx\`, \`*.vue\`, \`*.svelte\`, \`*.css\` | Frontend | + Accessibility, semantic HTML |\r
| \`*.sql\`, \`*migration*\`, \`*schema*\` | Database | + Migration safety, rollback plan |\r
| \`*.rs\`, \`Cargo.toml\`, \`*.go\`, \`go.mod\` | Backend | + Build verification, type safety |\r
| \`*.test.*\`, \`*.spec.*\`, \`__tests__/\` | Tests | + Coverage delta, flaky test detection |\r
| \`Dockerfile*\`, \`*.yml\`, \`*.yaml\`, \`Makefile\` | Infra | + Config validation, secret detection |\r
| \`*.md\`, \`*.txt\` | Docs | + Link checking, freshness |\r
\r
### Step 3: Run Checks in Parallel\r
\r
Launch all 3 modes with \`run_in_background: true\`.\r
\r
**\`--strict\` isolation protocol**: When strict mode is active, each mode agent must be launched with:\r
- Only the diff output from Step 1 as input (no session context)\r
- No access to other modes' intermediate or final results\r
- A fresh context window containing only: spec, diff, and the mode-specific checklist\r
\r
This ensures each mode forms independent conclusions. Results are combined only in Step 4 synthesis.\r
\r
---\r
\r
## Mode: audit:code (Review)\r
\r
### Constraints\r
- Be specific — cite file and line number for every finding\r
- Suggest fixes, don't just flag problems — every finding needs a one-line fix hint\r
\r
### Review Dimensions\r
\r
1. **Correctness**: Does the code do what it claims? Edge cases handled?\r
2. **Logic**: Race conditions, off-by-one, null pointer risks?\r
3. **Style**: Consistent with project conventions? Readable?\r
4. **Tests**: Changes covered by tests? Tests meaningful?\r
5. **Naming**: Do names clearly convey intent?\r
6. **Spec coverage**: Each Requirement addressed in the diff?\r
7. **Diff minimality**: Every hunk traces to a Requirement. Hunks that only reformat, re-wrap, re-quote, or reorder untouched code are WARN; list them and revert before ship.\r
\r
### Output Format\r
\r
\`\`\`\r
## Code Review: <file or area>\r
- [BLOCKER] <description> (line X)\r
- [WARN] <description> (line Y)\r
- [NIT] <description> (line Z)\r
\r
## Summary\r
- Blockers: N\r
- Warnings: N\r
- Verdict: APPROVE / REQUEST_CHANGES\r
\`\`\`\r
\r
---\r
\r
## Mode: audit:security (Security)\r
\r
### Constraints\r
- False positives are better than false negatives for security\r
- Always check \`.env\` files are in \`.gitignore\`\r
\r
### Security Checklist (OWASP Top 10)\r
\r
1. Injection (SQL, XSS, command)\r
2. Broken authentication\r
3. Sensitive data exposure\r
4. Access control failures\r
5. Security misconfiguration\r
\r
### Performance Checklist\r
\r
1. N+1 queries\r
2. Unbounded data loading\r
3. Missing indexes\r
4. Memory leaks (event listeners, growing caches)\r
5. Blocking main thread\r
\r
### Output Format\r
\r
\`\`\`\r
## Security Audit\r
- [CRITICAL] SQL injection risk in <file>:<line>\r
- [HIGH] Hardcoded secret in <file>:<line>\r
- [MEDIUM] Missing rate limit on <endpoint>\r
\r
## Performance Audit\r
- [HIGH] N+1 query in <file>:<line>\r
- [MEDIUM] Unbounded array growth in <file>:<line>\r
\r
## Summary\r
- Security: PASS / FAIL (N critical, N high)\r
- Performance: PASS / WARN (N issues)\r
\`\`\`\r
\r
---\r
\r
## Mode: audit:test (Test Runner)\r
\r
1. Run the full test suite\r
2. Verify each Acceptance Criterion is demonstrably met\r
3. Report coverage delta\r
4. Flag any flaky tests\r
\r
---\r
\r
### Step 3.5: Semantic Deduplication\r
\r
After all 3 modes complete, merge their findings and deduplicate:\r
\r
**Collection**: Gather all findings from code, security, and test modes into a single pool.\r
\r
**Root-Cause Grouping**: For each finding, identify the root cause. Findings sharing the same root cause (same file, same function, same underlying pattern) form a group.\r
\r
**Classification** (per group):\r
\r
| Classification | Meaning | Action |\r
|---------------|---------|--------|\r
| \`NEW\` | First finding for this root cause | Include in report |\r
| \`DUP_BETTER\` | Duplicate with better evidence or higher severity | Replace original with this |\r
| \`DUP_SKIP\` | Duplicate with weaker or equal evidence | Drop; reference the \`NEW\` finding |\r
\r
**Severity Reassessment**: The surviving finding in each group takes the highest severity across all modes. For example, if code review says \`[WARN]\` but security says \`[CRITICAL]\` for the same root cause, the deduped finding is \`[CRITICAL]\`.\r
\r
**Output**: Only deduplicated findings proceed to Step 4 synthesis. The report should note: "N findings deduplicated from M total (K groups collapsed)."\r
\r
---\r
\r
### Step 4: Synthesize\r
\r
Combine deduplicated findings into a single report:\r
\r
\`\`\`\r
## Audit Report\r
- Spec: SPEC-{timestamp} ({goal_slug})\r
- Branch: {current branch}\r
\r
### Change Scope\r
- Scopes detected: [API, Frontend, Backend, Database, Infra, Docs, Tests]\r
- Scope-specific checks: [list what ran]\r
\r
### Code Quality: [PASS/WARN/FAIL]\r
### Security: [PASS/WARN/FAIL]\r
### Performance: [PASS/WARN/FAIL]\r
### Tests: [X/Y passing, Z% coverage]\r
\r
### Deduplication\r
- Total findings: M\r
- Deduplicated: N (K groups collapsed)\r
\r
### Spec Coverage\r
- R1: ✅/❌ addressed in diff\r
- R2: ✅/❌ addressed in diff\r
- AC1: ✅/❌ verified by test\r
- AC2: ✅/❌ verified by test\r
\r
### Action Items\r
1. [blocker or warning]\r
\`\`\`\r
\r
### Step 5: Act\r
\r
- **All PASS + all AC verified**: **"Audit passed. Run \`/ship\` to create a PR."**\r
- **WARN**: Show warnings, ask if user wants to fix before shipping\r
- **FAIL or AC missing**: List each blocker with a one-line fix hint. **"Fix with \`/go\`, then re-run \`/audit\`."**\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "It's a small change, skip security" | Small changes introduce big vulnerabilities | Always run the security checklist |\r
| "Tests are passing, that's enough" | Tests don't catch security or performance issues | Run all 3 modes |\r
| "I'll fix the warnings later" | Later never comes | Fix blockers now, warnings before merge |\r
| "Dedup is overkill for small audits" | Small audits can still have cross-mode overlap | Always dedup — the cost is trivial |\r
| "Strict mode is overkill" | Without isolation, the builder can influence reviewers via shared context | Use \`--strict\` for security-sensitive or compliance-driven projects |\r
| "The agents are independent enough" | Shared context creates anchoring bias — a clean code review inflates security scores | Strict mode ensures blind scoring until synthesis |\r
\r
## Evidence Required\r
\r
- [ ] All 3 modes (code, security, test) completed\r
- [ ] Each Requirement has a coverage verdict\r
- [ ] Each AC has a test/verification verdict\r
- [ ] No BLOCKER items remain on PASS\r
- [ ] Deduplication applied: total vs. deduplicated count reported\r
\r
## Red Flags\r
\r
- Skipping security review for "small changes"\r
- Approving code with failing tests\r
- Ignoring performance warnings in hot paths\r
- Marking audit PASS when any AC is unverified\r
- Reporting raw findings without deduplication\r

\r
# Commit — Conventional Commits Generator\r
\r
## When to Trigger\r
- User wants to commit, save, or check in changes\r
- User asks to commit after completing a task\r
- Code changes are ready and user signals completion\r
\r
## Process\r
\r
1. **Gather context** — run in parallel:\r
   - \`git status\` — see what changed\r
   - \`git diff HEAD\` — see the actual diff\r
   - \`git log --oneline -5\` — match existing commit style\r
\r
2. **Determine type**:\r
   | Type | When |\r
   |------|------|\r
   | \`feat\` | New feature or capability |\r
   | \`fix\` | Bug fix |\r
   | \`refactor\` | Code change, no behavior change |\r
   | \`docs\` | Documentation only |\r
   | \`test\` | Adding or correcting tests |\r
   | \`build\` | Build system or dependencies |\r
   | \`chore\` | Maintenance task |\r
   | \`ci\` | CI/CD configuration |\r
   | \`style\` | Formatting, whitespace |\r
   | \`perf\` | Performance improvement |\r
\r
3. **Generate message**: \`type(scope): description\`\r
   - Lowercase type, optional scope\r
   - Imperative mood, no period, under 72 chars\r
   - Breaking changes: append \`!\` before \`:\`\r
   - Body only when diff needs extra context (max 3 bullet points)\r
\r
4. **Stage and commit**:\r
   - \`git add <specific files>\` — prefer explicit files over \`git add -A\`\r
   - \`git commit -m "type(scope): description"\`\r
   - Execute automatically — no confirmation needed\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "I'll just use a generic message" | Generic messages make git history useless. | Spend 5 seconds analyzing the diff — the type and scope are obvious from the changes. |\r
| "The user didn't specify a format" | Conventional Commits is the project standard — guard will block non-CC messages anyway. | Always generate CC format. |\r

- [ ] Message follows \`type(scope): description\` format\r
- [ ] Type accurately reflects the change (feat ≠ fix ≠ refactor)\r

- Vague messages: "update code", "fix stuff", "changes"\r
- Wrong type: using \`feat\` for a bug fix, \`fix\` for a new feature\r
- Staging unrelated files\r
- Using \`--no-verify\` to bypass hooks\r

# Council — Structured Multi-Voice Decision Making\r
\r
## Iron Law\r
NO MAJOR DECISION WITHOUT AT LEAST TWO OPPOSING VIEWPOINTS.\r
\r
## When to Trigger\r
- Architecture choices (monolith vs microservice, SQL vs NoSQL)\r
- Technology selection (framework, library, language)\r
- Design decisions with no clear right answer\r
- Trade-offs between competing requirements (speed vs quality, security vs usability)\r
- User explicitly requests deliberation\r
\r
## Process\r
\r
### 1. Identify the Decision\r
State the decision in one clear question. Example: "Should we use WebSockets or SSE for real-time updates?"\r
\r
### 2. Summon 4 Voices (Parallel)\r
\r
Launch 4 independent subagents using the Agent tool, each with ONLY the question and relevant context (NOT the full conversation history — this prevents anchoring bias):\r
\r
| Voice | Role | Focus |\r
|-------|------|-------|\r
| **Architect** | Long-term correctness | Maintainability, extensibility, architectural alignment |\r
| **Skeptic** | Challenge assumptions | Simpler alternatives, hidden costs, "what if we don't?" |\r
| **Pragmatist** | Ship it now | Timeline, user impact, operational complexity, team skills |\r
| **Critic** | Find the cracks | Edge cases, failure modes, migration risks, rollback difficulty |\r
\r
**Anti-Anchoring Rule**: Each voice receives only:\r
- The decision question\r
- Relevant codebase context (file paths, current architecture)\r
- Their role and focus area\r
They do NOT receive: the full conversation, other voices' opinions, or the user's leaning.\r
\r
### 3. Synthesize\r
\r
After all 4 voices report back:\r
1. List areas of **agreement** (strong signal)\r
2. List areas of **disagreement** (where trade-offs live)\r
3. Present the user with:\r
   - **Recommended option** (based on agreement weight)\r
   - **Key trade-off** (the real decision to make)\r
   - **Reversibility** (how hard to undo each option)\r
\r
### 4. Record Decision\r
\r
Save the decision to memory:\r
\`\`\`bash\r
epic mem add \\\r
  --title "Decision: {question}" \\\r
  --type decision \\\r
  --importance 0.9 \\\r
  --body "Context: ...\\nOptions: ...\\nChosen: ...\\nRationale: ...\\nTrade-off accepted: ..."\r
\`\`\`\r
\r

\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "I already know the answer" | Your gut feeling is not analysis. Council surfaces blind spots. | Run Council anyway — you'll learn something. |\r
| "This is too slow for a simple decision" | 5 minutes of council prevents weeks of regret. | Set a 5-minute timer and run the full process. |\r
| "The team already agreed" | Groupthink is not consensus. Diverse perspectives prevent disasters. | Summon all 4 voices — especially the Skeptic and Critic. |\r
| "I don't need 4 voices for this" | Even simple decisions benefit from the Skeptic and Critic. | Run all 4 voices. Skipping voices skips insight. |\r
\r

\r

- [ ] Areas of agreement and disagreement are listed\r
- [ ] A recommended option with key trade-off is presented\r
- [ ] Decision recorded in memory with rationale\r
- [ ] No voice received the full conversation history\r
\r
## Red Flags\r
- Skipping the Council for "obvious" decisions\r
- Only summoning voices that agree with you\r
- Reading the full conversation to all voices (anchoring)\r
- Not recording the decision and rationale\r

name: debug\r

description: "Systematic root-cause isolation for test failures, runtime errors, or unexpected behavior. Narrow hypothesis → verify → fix."\r
---\r
\r
# Debug — Systematic Debugging\r
\r
## Iron Law\r
\r
NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST. Symptom fixes are whack-a-mole debugging.\r
\r
## Process\r
\r
### 0. Recall\r
- Query the knowledge graph: \`epic mem search "ERROR_MESSAGE_OR_FILE"\` for the error message or file name\r
- Check if a \`resolution\` or \`pattern\` node exists for this error category\r
- If a past resolution exists, apply it directly instead of re-debugging from scratch\r
\r
**Why**: Past resolutions save 10-30 minutes of re-investigation. The knowledge graph exists so you don't repeat work.\r
\r
### 1. Observe\r
- Read the full error message and stack trace\r
- Identify: What was expected? What actually happened?\r
- Note the exact file, line, and function\r
\r
**Why**: Precise observation prevents misdiagnosis. Most debug loops start from skimming the error instead of reading it fully.\r
\r
### 2. Hypothesize\r
Form 2-3 possible causes. Rank by likelihood.\r
\r
**Why**: Ranked hypotheses prevent random code changes. Even a wrong hypothesis narrows the search space.\r
\r
### 3. Isolate\r
- **Narrow the scope**: Binary search through recent changes\r
- **Reproduce minimally**: Smallest input that triggers the error\r
- **Check assumptions**: Print/log intermediate values\r
- **Bisect**: \`git log --oneline -10\` — when did it last work?\r
\r
**Why**: Isolation proves the cause before you touch any code. Without it, you're guessing.\r
\r
### 4. Fix\r
- Fix the root cause, not the symptom\r
- If the fix is a workaround, add a TODO with explanation\r
\r
**Why**: Root cause fixes are permanent. Symptom patches rot and hide the real bug.\r
\r
### 5. Verify\r
- Run the failing test — must pass now\r
- Run the full test suite — no regressions\r
- If this was a bug, the regression test stays\r
\r
**Why**: A passing fix without verification is wishful thinking. The full suite catches side effects.\r
\r
### 6. Record\r
- If the fix involved 3+ debug steps, record a \`resolution\` node via \`epic mem add --title "..." --type resolution --body "..."\`\r
- Include: error category, root cause, solution approach\r
- This enables future sessions to skip re-debugging the same class of issues\r
\r
**Why**: Recording turns one-time debugging into institutional knowledge. Future sessions benefit from your effort.\r
\r
## When to Trigger\r
- Any test failure during \`/go\` execution\r
- Runtime error in tool output\r
- "Unexpected" in any output\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "Let me just try again" | Retrying without changing anything is not debugging. | Form a new hypothesis before each attempt. |\r
| "It works on my machine" | Environment differences are bugs too. | Reproduce in the actual target environment first. |\r
| "I'll just catch the exception" | That hides the bug, doesn't fix it. | Fix the root cause. Only catch what you can handle meaningfully. |\r
| "It's probably a flaky test" | Flaky tests hide real bugs. Prove it's flaky before dismissing. | Run it 3x in isolation. If it fails consistently, it's real. |\r
| "I'll add more logging" | Logging without a hypothesis is fishing. | Hypothesize first, then add targeted logging to confirm/deny. |\r
| "It's probably just a typo" | Assumptions are the enemy of debugging. Reproduce first, then diagnose. | Read the full error, reproduce it, and verify before assuming simplicity. |\r
| "Let me just try changing this one thing" | Whack-a-mole debugging creates more bugs. Follow the hypothesis → isolate → fix cycle. | Form a hypothesis, isolate the cause, then fix with evidence. |\r
| "The error message tells me everything" | Error messages describe symptoms, not root causes. Investigate the chain. | Trace the error to its origin. The message is the starting point, not the answer. |\r
\r
## Evidence Required\r
\r
Before claiming the bug is fixed, show ALL of these:\r
\r
- [ ] Root cause identified: one sentence explaining WHY it broke\r
- [ ] Fix applied: diff showing the change\r
- [ ] Previously failing test now passes (show output)\r
- [ ] Full test suite passes (no regressions)\r
- [ ] If bug came from a pattern, regression test added to prevent recurrence\r
\r
**"It works now" without root cause = symptom patch, not a fix.**\r
\r
## Red Flags\r
- Changing random things hoping something works\r
- More than 3 retry attempts without forming a new hypothesis\r
- Suppressing errors instead of fixing them\r
`,mf=`---\r
name: discover\r
description: "Trigger: vague/unfocused request or solution-without-problem. Also invoked via /discover command. Reframes goal before acting."\r
modes:\r
  - auto   # auto-triggered on vague/unfocused requests\r
  - /discover  # explicit invocation\r
---\r
\r
# Discover — Problem Discovery\r
\r
You are starting the **Discover** phase. Your job is to help the user articulate what problem they are actually trying to solve, before jumping to solutions or specs.\r
\r
**CRITICAL**: Run \`HARNESS_DIR=$(epic-harness path)\` first. NEVER use \`.harness/\` in the project directory.\r
\r
## Iron Law\r
\r
NO SPEC WITHOUT A PROBLEM STATEMENT. Building the wrong thing well is worse than building the right thing poorly.\r
\r
## Process\r
\r
### Step 0: Prerequisites\r
\r
- Resolve harness directory: \`HARNESS_DIR=$(epic-harness path)\`\r
- Read any existing context (CLAUDE.md, README, codebase structure)\r
- Check for existing problem statements in \`$HARNESS_DIR/specs/PROBLEM-*.md\`\r
- Call \`mem_recall\` with a hint describing the current topic area\r
- Check for past \`decision\` or \`pattern\` nodes related to this domain\r
- If prior problem exploration exists, reference it: "We discussed something similar before..."\r
- If existing PROBLEM files are found, review them — the user may be continuing prior work\r
\r
**Why**: Past context prevents re-exploring ground already covered. The knowledge graph connects today's vague request to yesterday's decisions.\r
\r
### Step 1: Listen\r
\r
Read the user's request carefully. Repeat it back in your own words and ask:\r
- "Is that the core of it, or is there more?"\r
\r
Categorize the request:\r
\r
| Category | Signal | Example |\r
|----------|--------|---------|\r
| Solution without problem | User names a technology or approach | "Add Redis caching" |\r
| Feature without context | User describes output, not why | "Build a dashboard" |\r
| Systemic complaint | Broad negative without specifics | "Everything is slow" |\r
| Vague ambition | Goal with no boundaries | "Make it better" |\r
| Clear problem | Observable gap stated | "Login fails for 5% of users" |\r
\r
**Why**: Categorization determines the probing technique. Misreading the category leads to wrong questions.\r
\r
### Step 2: Probe\r
\r
Select the technique based on the category identified in Step 1. Ask **max 3 questions per round**, run **max 3 rounds**. If the user can't answer or says "I'm not sure", proceed to Frame with what you have.\r
\r
#### Technique Selection\r
\r
| User signal | Technique | Core question |\r
|---|---|---|\r
| Names a solution ("Add Redis") | **5 Whys** | "What's happening that makes you need this?" → repeat |\r
| Describes a feature without why | **JTBD** | "What situation makes you need this? What would 'done' look like?" |\r
| "Everything is broken" | **Fishbone** | "Which area: People / Process / Technology / Data / Environment?" |\r
| Vague or contradictory | **Socratic** | "What specifically do you mean by 'X'?" |\r
| Has a vision but no path | **Done looks like** | "When this works perfectly, what do you see?" |\r
| Uncertain assumptions | **Assumption map** | "What must be true for this to work?" |\r
\r
#### Detailed Technique Reference\r
\r
**5 Whys** — when the user presents a solution without a problem:\r
\`\`\`\r
User: "Add Redis caching to the API."\r
→ "What's happening that makes you want caching?"\r
→ "Why is that slow?"\r
→ "Why does that query take long?"\r
\`\`\`\r
Stop when you reach an actionable root cause. Max 5 levels.\r
\r
**JTBD (Jobs To Be Done)** — when the user describes a feature without context:\r
\`\`\`\r
User: "Build a dashboard."\r
→ "What situation makes you need this?"\r
→ "What would you do with the information right now?"\r
→ "What would have to be true for you to say 'this solved it'?"\r
\`\`\`\r
Extract job stories: "When [situation], I want [motivation], so I can [outcome]."\r
\r
**Fishbone** — when the user has a systemic complaint:\r
\`\`\`\r
User: "Everything is broken."\r
→ Walk through categories: People, Process, Technology, Data, Environment\r
→ "Which of these areas is the biggest contributor?"\r
→ "Is this on all branches or specific ones?"\r
\`\`\`\r
Map causes across categories, then narrow to the top 1-2.\r
\r
**Socratic Questioning** — when the request is vague or contradictory:\r
\`\`\`\r
User: "Make it more secure." / "I want it to be faster."\r
→ Clarification: "What specifically do you mean by 'secure' / 'fast'?"\r
→ Probing assumptions: "What makes you believe this is the issue?"\r
→ Implications: "If we change X, what happens to Y?"\r
→ Alternatives: "What other approaches did you consider?"\r
\`\`\`\r
\r
**"What Does Done Look Like?"** — when the user has a vision but no path:\r
\`\`\`\r
→ "When this is shipped and working perfectly, what specifically do you see?"\r
→ "What would I click, what output would appear, what would the logs show?"\r
\`\`\`\r
Work backwards from the concrete end state.\r
\r
**Assumption Mapping** — when the request depends on uncertain premises:\r
\`\`\`\r
→ "Let me check what we're assuming must be true for this to work."\r
→ List 4-5 assumptions, ask which are uncertain.\r
\`\`\`\r
Shaky assumptions become prerequisites.\r
\r
Each round should narrow the space. If after 2 rounds you have enough to frame, don't force a third.\r
\r
**Why**: The right technique extracts the real problem in 2-3 rounds instead of 10 random questions. Technique mismatch wastes rounds and frustrates the user.\r
\r
### Step 3: Frame\r
\r
Synthesize everything into a structured problem statement:\r
\r
> **[Who]** experiences **[observable problem]** when **[trigger condition]**, resulting in **[quantified impact]**. The desired state is **[measurable outcome]**.\r
\r
Capture supporting context:\r
- **Root cause** (from 5 Whys) or **Job story** (from JTBD)\r
- **Constraints**: timeline, technology, scale, compatibility\r
- **Assumptions**: what must be true, which are uncertain\r
- **Out of scope**: what this problem explicitly does NOT cover\r
\r
Show the frame to the user and ask: "Does this capture the problem accurately?"\r
\r
**Why**: A written problem statement is testable. If you can't write one, you haven't discovered the problem yet.\r
\r
### Step 4: Save\r
\r
Once confirmed, save the problem statement:\r
\r
\`\`\`bash\r
mkdir -p "$HARNESS_DIR/specs"\r
\`\`\`\r
\r
Write to \`$HARNESS_DIR/specs/PROBLEM-{timestamp}.md\` (see Output Format below).\r
\r
If the user realizes there are multiple problems during probing, address them one at a time. Each problem gets its own file.\r
\r
### Step 5: Transition\r
\r
Tell the user: **"Problem defined. Run \`/spec\` to turn this into a buildable specification."**\r
\r
If the user wants to explore further (e.g., they realize there are actually 3 problems), loop back to Step 2 with the new angle.\r
\r
**Why**: The transition from problem to spec is natural but explicit. The user owns the decision to move forward.\r
\r
## When to Trigger\r
\r
**Auto-trigger** (no command needed):\r
- User's request lacks a clear problem or goal\r
- User names a technology/solution without explaining why\r
- User describes symptoms without identifying the underlying issue\r
- User says "I don't know where to start" or equivalent\r
- Request is so broad it could mean 3+ different things\r
\r
**Explicit invocation** (\`/discover\`):\r
- User wants to formally start the discover phase for a new project or feature\r
- User wants to re-explore a problem before re-specifying\r
- Continuation from a previous discovery session\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "Let's just start building and figure it out" | Building without a problem is expensive guessing. | Spend 5 minutes framing the problem. It saves hours of rework. |\r
| "The problem is obvious" | If it were obvious, you'd have a spec, not a vague request. | Write the problem statement. If it's obvious, it takes 30 seconds. |\r
| "I don't have time for questions" | You don't have time to build the wrong thing. | Run 2 focused rounds, not 10 open-ended ones. |\r
| "I already told you the problem" | You told me a solution. The problem is why you need that solution. | Ask one "why" question. If the answer reveals the problem, proceed. |\r
| "Can't you just figure it out from the code?" | Code shows what exists, not what's missing or why it hurts. | Combine code exploration with user context for the full picture. |\r
| "Let me just show you the bug" | A bug is a symptom, not a problem. Fixing symptoms is whack-a-mole. | Trace the bug to its root cause before jumping to a fix. |\r
\r
## Evidence Required\r
\r
Before claiming the problem is defined, show ALL of these:\r
\r
- [ ] Problem statement written in the structured format (Who / Problem / When / Impact / Desired state)\r
- [ ] Root cause or job story identified\r
- [ ] At least one measurable/observable criterion for success\r
- [ ] User confirmed the frame is accurate\r
- [ ] Scope boundaries stated (what's in and out)\r
\r
**"I think I understand" without a written problem statement = guessing.**\r
\r
## Red Flags\r
\r
- Jumping to solutions or code during the discovery conversation\r
- Asking more than 3 questions per round (overwhelming the user)\r
- Running more than 3 rounds without attempting a frame (analysis paralysis)\r
- Ignoring when the user says "I'm not sure" — that IS information\r
- Producing a problem statement the user didn't confirm\r
- Confusing symptoms with root causes\r
- Framing the problem so broadly it could mean anything ("improve the system")\r
- Skipping discovery for non-trivial, ambiguous work\r
\r
## Output Format\r
\r
Save to \`$HARNESS_DIR/specs/PROBLEM-{timestamp}.md\`:\r
\r
\`\`\`markdown\r
---\r
status: framed\r
created: {ISO-8601 timestamp}\r
context: {one-line summary}\r
---\r
\r
# Problem: {title}\r
\r
## Problem Statement\r
{Who} experiences {observable problem} when {trigger condition}, resulting in {quantified impact}. The desired state is {measurable outcome}.\r
\r
## Root Cause / Job Story\r
{5 Whys chain or JTBD job story}\r
\r
## Constraints\r
- Timeline: {when is this needed}\r
- Technology: {stack constraints}\r
- Scale: {expected load/users}\r
- Compatibility: {backward-compat requirements}\r
\r
## Assumptions\r
- {assumption} — {certain / uncertain}\r
- {assumption} — {certain / uncertain}\r
\r
## Out of Scope\r
- {what this problem explicitly does NOT cover}\r
\`\`\`\r

\r
## When to Trigger\r
- New public function, class, or API endpoint\r
- Function signature changed (params added/removed)\r
- Module purpose unclear from code alone\r
- User explicitly asks for documentation\r
\r
## Process\r
\r
### 1. Detect what changed\r
- New exports? → Add JSDoc/docstring\r
- Changed params? → Update existing docs\r
- New file? → Add module-level doc comment\r
\r

\r
### 2. Write docs\r
Follow the project's existing doc style. If none exists:\r
\r
**TypeScript/JavaScript:**\r
\`\`\`typescript\r
/**\r
 * Brief description of what this does.\r
 *\r
 * @param name - Description of parameter\r
 * @returns Description of return value\r
 * @throws ErrorType - When this happens\r
 *\r
 * @example\r
 * const result = myFunction("input");\r
 */\r
\`\`\`\r
\r
**Python:**\r
\`\`\`python\r
def my_function(name: str) -> str:\r
    """Brief description.\r
\r
    Args:\r
        name: Description of parameter.\r
\r
    Returns:\r
        Description of return value.\r
\r
    Raises:\r
        ValueError: When this happens.\r
    """\r
\`\`\`\r
\r
**Why:** Consistent doc style across the project reduces cognitive load for every reader. Inlining examples prevents the "how do I call this?" round-trip.\r
\r
### 3. Don't over-document\r
- Skip obvious getters/setters\r
- Skip internal/private helpers unless complex\r
- Code should be self-documenting first, comments second\r
\r
**Why:** Noise docs train readers to ignore all comments. Document only where the code cannot speak for itself.\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "The code is self-documenting" | Good naming helps readers, but doesn't explain intent, constraints, or edge cases. | Document the why, the constraints, and the non-obvious. |\r
| "I'll document it later" | Later never comes. If it's worth exporting, it's worth documenting now. | Document as you write. Updating is cheaper than reconstructing intent. |\r
| "Docs go stale anyway" | Stale docs are better than no docs. They at least signal intent. Keep them in sync with code changes. | Put docs near code (JSDoc/docstring). They update with the code. |\r
\r
## Evidence Required\r
\r
Before claiming documentation is done, show ALL applicable:\r
\r
- [ ] Every new public function/class has a doc comment (show one example)\r
- [ ] Changed signatures have updated docs (show the diff)\r
- [ ] \`@param\` / \`@returns\` / \`@throws\` present for non-trivial functions\r
- [ ] At least one \`@example\` for complex APIs\r
\r
**"I added docs" without showing them = not documented.**\r
\r
## Red Flags\r
- Comments that restate the code: \`// increment i\` → \`i++\`\r
- Outdated comments that contradict the code\r
- Missing docs on public API that others will call\r

\r
4 dimensions run in parallel where possible:\r
\r
1. **eval:correctness** — Test pass rate, mutation score, assertion density\r
2. **eval:performance** — Throughput, latency, memory (opt-in)\r
3. **eval:quality** — Lint, code quality, LLM-as-judge\r
4. **eval:regression** — Baseline comparison, score deltas\r
\r
---\r
\r
## Process\r
\r
### Step 0: Prerequisites\r
\r
\`\`\`bash\r
HARNESS_DIR=$(epic path)\r

\`\`\`bash\r
epic eval --init\r
\`\`\`\r
\r
Read the config:\r
\`\`\`bash\r
cat $HARNESS_DIR/eval/eval.yaml\r
\`\`\`\r
\r
### Step 0.5: Scaffold benchmarks (when no benchmark infrastructure exists)\r
\r
If \`eval.yaml\` has \`benchmarks: []\` and no benchmark files are found in the project:\r
\r
1. **Generate stub files** using the CLI:\r
   \`\`\`bash\r
   epic eval --scaffold\r
   \`\`\`\r
   Supported stacks (auto-detected from project markers):\r
\r
   | Stack | Detected by | Generated file | Output format |\r
   |-------|-------------|----------------|---------------|\r
   | Rust | \`Cargo.toml\` | \`benches/eval_harness.rs\` | criterion (exit code) |\r
   | Python | \`pyproject.toml\` / \`setup.py\` | \`benchmarks/eval_runner.py\` | JSON composite |\r
   | TypeScript | \`tsconfig.json\` | \`benchmarks/eval.ts\` | JSON composite |\r
   | Node.js | \`package.json\` | \`benchmarks/eval.mjs\` | JSON composite |\r
   | Go | \`go.mod\` | \`benchmarks/eval_test.go\` | JSON composite |\r
   | Java | \`pom.xml\` / \`build.gradle\` | \`benchmarks/EvalBenchmark.java\` | exit code |\r
   | Kotlin | \`build.gradle.kts\` | \`benchmarks/EvalBenchmark.kt\` | exit code |\r

   | PHP | \`composer.json\` | \`benchmarks/eval_benchmark.php\` | JSON composite |\r
   | C# | \`*.csproj\` / \`*.sln\` | \`Benchmarks/EvalBenchmark.cs\` | JSON composite |\r
   | Swift | \`Package.swift\` | \`benchmarks/EvalBenchmark.swift\` | JSON composite |\r
   | Elixir | \`mix.exs\` | \`benchmarks/eval_benchmark.exs\` | JSON composite |\r
   | C++ | \`CMakeLists.txt\` | \`benchmarks/eval_benchmark.cpp\` | exit code |\r
\r
2. **Customize the generated file** — every file has \`# TODO\` / \`// TODO\` markers:\r

\r
3. **If \`--scaffold\` can't generate a useful stub** (domain too complex, custom evaluation logic needed), generate a custom benchmark with LLM assistance:\r
   - Read the project's main source files to understand the domain\r
   - Identify the 2–3 most critical quality signals (latency, accuracy, throughput, precision/recall)\r
   - Write a benchmark that measures those signals and outputs \`{"composite": 0.0–1.0, ...}\`\r
   - Save to \`benchmarks/eval_runner.{ext}\` matching the project language\r
\r
4. **Wire into eval.yaml**:\r
   \`\`\`yaml\r
   benchmarks:\r
     - name: eval_runner\r
       command: python3 benchmarks/eval_runner.py full\r
       result_type: composite   # parse composite field from JSON stdout\r
   \`\`\`\r
   Use \`result_type: exit_code\` for frameworks (criterion, JMH, BenchmarkDotNet) that manage their own output.\r
\r
### Step 1: Run Rust CLI\r
\r
Execute the structured evaluation via the Rust binary:\r
\`\`\`bash\r
epic eval --json\r
\`\`\`\r
\r
This runs all enabled dimensions and outputs a JSON result. Capture the output.\r
\r
If the CLI reports \`llm_judge: SKIPPED\` (no LLM available in CLI mode), proceed to Step 2 for LLM-as-judge. Otherwise, skip to Step 3.\r
\r
### Step 2: LLM-as-Judge (when llm_judge enabled)\r
\r
If the quality dimension has \`llm_judge: true\` and CLI marked it SKIPPED:\r
\r
1. Sample 3–5 changed files from the current branch:\r
   \`\`\`bash\r
   git diff --name-only $(git merge-base HEAD main)\r
   \`\`\`\r
\r
2. For each sampled file, evaluate on a 1-10 rubric:\r
   - **Readability** (naming, structure, flow)\r
   - **Correctness** (logic, edge cases, error handling)\r
   - **DRY** (no unjustified duplication)\r
   - **Security** (no obvious vulnerabilities)\r
\r
3. Average scores across files. Map to 0.0–1.0 scale.\r
\r
4. Record results alongside CLI output.\r
\r
### Step 3: Load Baseline\r
\r
\`\`\`bash\r
cat $HARNESS_DIR/eval/baselines/latest.json\r
\`\`\`\r
\r
If no baseline exists, the current run BECOMES the first baseline. Save it:\r
\`\`\`bash\r
epic eval --baseline-update\r
\`\`\`\r
\r
Report: "First baseline established. Future runs will compare against this."\r
\r
### Step 4: Synthesize Report\r
\r
Combine CLI output + LLM-as-judge results into a single report:\r
\r
\`\`\`\r
## Eval Report\r
- Branch: {branch}\r
- Commit: {commit_short}\r
\r
### Correctness: [PASS/WARN/FAIL] — score: {score}\r
- Tests: {passed}/{total} passing ({pass_rate}%)\r
- Mutation score: {mutation_score}% (if enabled)\r
- Delta vs baseline: {+/-delta}\r
\r
### Performance: [PASS/WARN/FAIL] — score: {score} (if enabled)\r
- Avg latency: {latency}ms (delta: {+/-delta})\r
- Throughput: {throughput} (delta: {+/-delta})\r
\r
### Quality: [PASS/WARN/FAIL] — score: {score}\r
- Lint errors: {count}\r
- LLM judge: {score}/10 (if enabled)\r
\r
### Regression: [PASS/FAIL]\r
| Dimension | Baseline | Current | Delta | Verdict |\r
|-----------|----------|---------|-------|---------|\r
| correctness | {prev} | {cur} | {delta} | {pass/fail} |\r
| quality | {prev} | {cur} | {delta} | {pass/fail} |\r
\r
### Overall: [PASS/WARN/FAIL] — {overall_score}\r
\`\`\`\r
\r
### Step 5: Act\r
\r
- **All PASS + no regression**: "Eval passed. Run \`/ship\` to create a PR."\r
- **WARN**: Show warnings. Ask whether to fix before shipping.\r
- **FAIL or regression detected**: List each failure with fix hint. "Fix with \`/go\`, then re-run \`/eval\`."\r
\r
### Step 6: Save Results\r
\r
\`\`\`bash\r
epic eval --baseline-update  # if user approves this as new baseline\r
\`\`\`\r
\r
Results auto-saved to \`$HARNESS_DIR/eval/results/EVAL-{timestamp}.json\`.\r
\r
---\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "Tests pass, no need for eval" | Tests pass today but regress tomorrow without baselines | Run eval and establish a baseline |\r
| "Performance testing is premature" | Latency regressions are invisible until users complain | Enable performance dimension, run benchmarks now |\r
| "Mutation testing is too slow" | Slow mutation catches bugs fast tests miss | Run on changed modules only (\`--dimension correctness\`) |\r
| "LLM-as-judge is subjective" | Subjective beats absent — fixed rubric + averaging reduces variance | Use the 4-axis rubric, average across 3+ files |\r
| "We can add eval later" | Later never comes; regressions accumulate silently | Start with correctness+quality, add dimensions incrementally |\r
| "CI will catch regressions" | CI only catches build/test failures, not quality drift | Eval measures what CI misses: mutation score, LLM quality |\r
\r
## Evidence Required\r
\r
- [ ] \`epic eval --json\` output captured (all enabled dimensions scored)\r
- [ ] Baseline comparison performed (or first baseline established)\r
- [ ] Each dimension has PASS/WARN/FAIL verdict\r
- [ ] No dimension regressed beyond threshold (or explicit user override)\r
- [ ] Results saved to \`$HARNESS_DIR/eval/results/\`\r
- [ ] LLM-as-judge scores recorded (if enabled)\r
\r
## Red Flags\r
\r
- Reporting PASS without actual \`epic eval\` output\r
- Skipping regression comparison "because it's the first run" (first run should ESTABLISH baseline)\r
- Reporting PASS with 0 test coverage\r
- Ignoring mutation score drops >5%\r
- Marking eval PASS when any dimension below minimum threshold\r
- Running eval on main branch instead of feature branch\r

`,xf=`---\r
name: go\r
description: "Go phase. Reads the approved SPEC file, maps Requirements to tasks (plan), executes via TDD (build), and integrates results verifying all Acceptance Criteria."\r
---\r
\r
# Go — Build It\r
\r
**CRITICAL**: Run \`HARNESS_DIR=$(epic-harness path)\` first. NEVER use \`.harness/\` in the project directory.\r
\r
## Execution Modes\r
\r
This skill has 3 internal modes that run sequentially:\r
\r
1. **go:plan** — Decompose requirements into ordered, parallelizable tasks\r
2. **go:build** — Execute each task using TDD (Red→Green→Refactor)\r
3. **go:integrate** — Merge results, verify all ACs, fix failures\r
\r
---\r
\r
## Mode: go:plan (Plan)\r
\r
Decompose the spec into an execution plan.\r
\r
### Process\r
\r
1. **Load the spec:**\r
   \`\`\`bash\r
   ls -t $HARNESS_DIR/specs/SPEC-*.md | head -1\r
   \`\`\`\r
   Read the file. Confirm frontmatter has \`status: approved\`. If not, invoke the **spec** skill first.\r
\r
2. **Survey the codebase**: Identify relevant files, modules, patterns for each requirement.\r
\r
3. **Decompose**: Map each Requirement → one or more Tasks. Every task must reference its source requirement:\r
\r
   \`\`\`\r
   Task 1: [description] — satisfies: R1 — depends on: none — modifies: [file list]\r
   Task 2: [description] — satisfies: R2 — depends on: Task 1 — modifies: [file list]\r
   Task 3: [description] — satisfies: R1,R2 (integration) — depends on: Task 1,2 — modifies: [file list]\r
   \`\`\`\r
\r
4. **Conflict analysis**:\r
   - Tasks modifying same files → serialize or use worktree isolation\r
   - Tasks modifying different files → safe to parallelize\r
   - Don't plan more than 8 tasks — if bigger, split into phases\r
   - Include "verify integration" as final task if 3+ tasks\r
\r
5. Show the plan. Get user confirmation (or auto-proceed if in \`/orbit\`).\r
\r
6. **Identify risks**: For each task, list potential failure modes:\r
   \`\`\`\r
   ### Risks\r
   - {risk}: {mitigation}\r
   \`\`\`\r
\r
7. **Create feature branch** (standalone invocation only — \`/orbit\` handles this in Step 3):\r
   \`\`\`bash\r
   git checkout -b feature/{goal_slug}\r
   \`\`\`\r
\r
### Execution Order Format\r
\r
\`\`\`\r
- Batch 1 (parallel): Task 1, Task 3\r
- Batch 2 (sequential): Task 2\r
\`\`\`\r
\r
---\r
\r
## Mode: go:build (Execute TDD)\r
\r
For each task, follow this TDD cycle:\r
\r
### Builder Protocol\r
\r
1. Read the task description carefully\r
2. Identify what file(s) to create or modify\r
3. **Red**: Write the test(s) — confirm they fail\r
4. **Green**: Write the minimum code to pass\r
5. **Refactor**: Clean up if needed — no behavior changes\r
6. Run tests — confirm they pass\r
7. Report: what was built, what tests pass\r
\r
### Parallel Execution\r
\r
Launch sub-agents with these rules:\r
- \`run_in_background: true\` for independent tasks (parallel execution)\r
- \`isolation: "worktree"\` if and only if parallel tasks modify overlapping files\r
\r
| Scenario | Parallel? | Same Files? | Isolation? |\r
|----------|-----------|-------------|------------|\r
| Task A, B sequential | No | Any | No |\r
| Task A, B parallel | Yes | No overlap | No |\r
| Task A, B parallel | Yes | Overlap exists | Yes |\r
\r
### Subagent Result States\r
\r
| State | Meaning | Follow-up |\r
|-------|---------|-----------|\r
| **DONE** | Task completed, all tests pass | Proceed |\r
| **DONE_WITH_CONCERNS** | Completed but has warnings | Review. Escalate security/data/breaking issues. |\r
| **NEEDS_CONTEXT** | Cannot proceed without user input | Prompt user with specific questions |\r
| **BLOCKED** | Unresolvable error | Try one alternative. If still blocked, report. |\r
\r
If stuck 3+ times → invoke **agent-introspection** skill.\r
\r
### Subagent Output Format\r
\r
\`\`\`\r
## Status: [DONE|DONE_WITH_CONCERNS|NEEDS_CONTEXT|BLOCKED]\r
## Summary: [1-2 sentences]\r
## Evidence: [test output, file changes]\r
## Concerns: [only for DONE_WITH_CONCERNS]\r
## Questions: [only for NEEDS_CONTEXT]\r
## Blocker: [only for BLOCKED]\r
\`\`\`\r
\r
---\r
\r
## Mode: go:integrate (Integrate)\r
\r
After all tasks complete:\r
\r
1. Categorize each task result by state (DONE/CONCERNS/NEEDS_CONTEXT/BLOCKED)\r
2. Resolve NEEDS_CONTEXT tasks before integration\r
3. Attempt alternatives for BLOCKED tasks, exclude from "satisfied" count\r
4. Run the full test suite\r
5. Verify each Acceptance Criterion (AC1, AC2, ...) is demonstrably met\r
6. If anything fails, dispatch a fix and re-verify\r
7. Append to the spec file's \`## Implementation Notes\`: decisions the spec left open and how they were made, files touched outside the plan, surprises (a test that lied, a dependency that behaved differently). Append only; never edit the sections above it. This is the record \`/audit\` and the next session read instead of re-deriving.\r
\r
### Go Report\r
\r
\`\`\`\r
## Go Report\r
- Spec: SPEC-{timestamp} ({goal_slug})\r
- Branch: {branch}\r
- Requirements satisfied: R1 ✅, R2 ✅, ...\r
- AC verified: AC1 ✅, AC2 ✅, ...\r
- Tests: X/Y passing\r
- Subagent states: X DONE, Y CONCERNS, Z BLOCKED\r
- Remaining issues: none / [list]\r
\`\`\`\r
\r
Tell the user: **"Build complete. Run \`/audit\` to verify before shipping."**\r
\r
## Skills Auto-Triggered\r
\r
- **tdd**: Every subagent follows red-green-refactor\r
- **debug**: On any test failure or error\r
- **verify**: Before marking any task complete\r
- **simplify**: If any file exceeds 200 lines\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "I'll just implement it all in one go" | No plan = no accountability | Plan tasks, map to requirements |\r
| "Tests slow me down" | Debugging takes longer than testing | Write test first, always |\r
| "I'll skip the plan, it's obvious" | "Obvious" hides assumptions | Plan even for simple changes |\r
| "I can modify files outside my task" | Scope creep introduces bugs | Stay within task boundaries |\r
\r
## Evidence Required\r
\r
- [ ] Plan exists with tasks mapped to Requirements\r
- [ ] Spec's \`## Implementation Notes\` appended (or an explicit \`- none\` line if nothing was learned)\r
- [ ] Each task has test(s) that pass\r
- [ ] All Acceptance Criteria verified\r
- [ ] Full test suite passes\r
- [ ] No uncommitted changes in worktree\r
\r
## Red Flags\r
\r
- Implementing without a plan\r
- Skipping tests "to save time"\r
- Not verifying the full suite after integration\r
- Implementing everything in a single file\r
- Starting without a \`status: approved\` spec\r

\r
# Perf — Performance Review\r
\r
## Process\r
\r
1. Identify performance-sensitive code paths from the diff (loops, queries, rendering, batch ops)\r
2. Run the Checklist below, marking each item as pass, fail, or N/A with reason\r
3. For each failure, cite the file and line number with a one-line fix hint\r
4. Report findings using the Evidence Required section\r
\r
## When to Trigger\r
- Database queries inside loops\r
- Large data set processing\r
- Rendering or UI update logic\r
- API endpoint that could receive high traffic\r
- File I/O in hot paths\r
\r
## Checklist\r
\r
### Database\r
- [ ] No N+1 queries (use JOIN, eager loading, or batch) — N+1 queries cause latency to scale linearly with row count, turning a 1ms query into seconds under load.\r
- [ ] Indexes exist for frequently queried columns — without indexes, the database performs full table scans, collapsing read throughput.\r
- [ ] Pagination for large result sets — fetching all rows at once exhausts memory and increases response time for every consumer.\r
- [ ] Connection pooling configured — opening a new connection per request adds network round-trip overhead and can exhaust database connection limits.\r
\r
### Memory\r
- [ ] No unbounded arrays or caches growing indefinitely — unbounded growth causes gradual memory exhaustion and eventual OOM kills with no warning.\r
- [ ] Event listeners properly removed / unsubscribed — leaked listeners hold references to their context, preventing garbage collection of entire object graphs.\r
- [ ] Large objects released after use — holding references to large payloads keeps them in the heap, increasing GC pressure and pause times.\r
- [ ] Streams used for large file processing (not loading entire file) — loading a multi-GB file into RAM blocks other allocations and risks crashing the process.\r
\r
### Computation\r
- [ ] Expensive calculations memoized where appropriate — recomputing pure results on every call wastes CPU cycles that compound in hot paths.\r
- [ ] No redundant re-renders (React: useMemo, useCallback) — unnecessary re-renders cascade through the component tree, causing layout thrash and dropped frames.\r
- [ ] Async operations don't block the main thread — blocking the main thread stalls all concurrent requests, degrading throughput for every user.\r
- [ ] Debounce/throttle on frequent events (scroll, input) — unthrottled handlers fire hundreds of times per second, overwhelming the event loop.\r
\r
### Network\r
- [ ] Responses compressed (gzip/brotli) — uncompressed JSON/HTML can be 5-10x larger, wasting bandwidth and increasing time-to-first-byte.\r
- [ ] Static assets cached with proper headers — missing cache headers force the browser to re-download unchanged assets on every page load.\r
- [ ] No unnecessary API calls (cache, dedupe) — duplicate requests waste server resources and increase latency for legitimate traffic.\r
\r
See \`references/performance.md\` for the full checklist.\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|--------------------|\r
| "Premature optimization is the root of all evil" | Knuth said "about 97% of the time" — the other 3% matters. N+1 queries are never premature. | Check for N+1 queries and missing indexes before merging. |\r
| "It works fine on my machine" | Your machine is not production. Profile under realistic conditions. | Run the perf checklist against realistic data volumes. |\r
| "We can optimize later" | Performance debt is invisible until it's catastrophic. Measure now. | Add a benchmark or load test for the critical path today. |\r
\r
## Evidence Required\r
\r
Before claiming performance review is complete, show ALL applicable:\r
\r

- Self-Improvement low → \`/evolve history\` periodic review, manual pattern notes\r

# Secure — Security Review\r
\r
## Iron Law\r
\r
NO DEPLOYMENT WITHOUT SECURITY REVIEW OF ALL CHANGED FILES. Every code change is a potential attack vector.\r
\r
## Process\r
\r
### Step 0: Load Engagement Context (Optional)\r
\r

\`\`\`bash\r
cat .harness/engagement.md 2>/dev/null\r
\`\`\`\r
\r

1. Parse the **Scope**, **Constraints**, and **Exclusions** sections\r
2. Restrict security checks to in-scope components\r
3. Apply rules of engagement (method, rate limits, no-exfil rules)\r
4. Skip findings matching exclusion patterns\r
5. Include engagement reference in report header\r
\r
If not found: apply full OWASP Top 10 checklist (default behavior). No scope restrictions.\r
\r
See \`references/engagement.md\` for the engagement file format.\r
\r
### Step 1: Identify Security-Relevant Changes\r
\r
Identify security-relevant changes from the diff (auth, DB, API, infra, secrets).\r
\r
### Step 2: Run Checklist\r
\r
Run the Checklist below, marking each item as pass, fail, or N/A with reason.\r
\r
### Step 3: Report\r
\r
For each failure, cite the file and line number with severity (CRITICAL/HIGH/MEDIUM).\r
Report findings using the Evidence Required section.\r
\r
## When to Trigger\r
- Authentication or authorization code changed\r
- Database queries written or modified\r
- API endpoints added or changed\r
- Environment variables or secrets referenced\r
- File upload, user input parsing, or serialization code\r
- Infrastructure config (Docker, K8s, CI/CD)\r
\r
## Checklist\r
\r
### Injection\r
- [ ] All user input sanitized/escaped before use in queries — unsanitized input is the #1 attack vector for SQL injection, XSS, and command injection\r
- [ ] Parameterized queries used (no string concatenation in SQL) — string concatenation enables SQL injection even with escaping; parameterized queries are the only safe default\r
- [ ] No \`eval()\`, \`exec()\`, or template injection vectors — these functions execute arbitrary code and bypass all input validation\r
\r
### Authentication & Authorization\r
- [ ] Auth checks on every protected endpoint — missing checks on a single endpoint exposes the entire system\r
- [ ] Tokens validated and not just decoded — decoding without signature verification lets attackers forge any token\r
- [ ] Session expiry and refresh logic correct — stale sessions allow account takeover; refresh token rotation prevents replay attacks\r
- [ ] No hardcoded credentials or secrets in code — hardcoded secrets end up in version control and are impossible to rotate\r
\r
### Data Exposure\r
- [ ] Sensitive data not logged (passwords, tokens, PII) — logs are often accessible to more people than the database and persist indefinitely\r
- [ ] API responses don't leak internal details — stack traces, DB schemas, and server versions help attackers craft targeted exploits\r
- [ ] Error messages don't reveal system internals — generic errors in production prevent information disclosure; detailed errors belong in server logs only\r
- [ ] \`.env\` files in \`.gitignore\` — committed \`.env\` files expose secrets permanently even after deletion (git history retains them)\r
\r
### Access Control\r
- [ ] RBAC/permissions checked before data access — authorization must happen at the data layer, not just the UI layer, to prevent IDOR and privilege escalation\r
- [ ] No IDOR (Insecure Direct Object Reference) vulnerabilities — replacing an ID in a URL should never grant access to another user's resource\r
- [ ] Rate limiting on authentication endpoints — without rate limiting, brute-force and credential-stuffing attacks are trivial\r
\r
See \`references/security.md\` for the full OWASP Top 10 checklist.\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "This is internal-only, no security risk" | Internal tools get exposed. Assume every endpoint is public-facing. | Apply the same security standards as public APIs. |\r
| "We'll add security later" | Security debt compounds exponentially. Fix it now or pay 10x later. | Build it secure from the start. Retrofitting misses edge cases. |\r
| "The framework handles security" | Frameworks provide tools, not guarantees. OWASP Top 10 still applies. | Verify framework defaults and add application-layer checks. |\r
| "Security review is overkill for this" | One missed injection is a breach. Every input surface matters. | Run the checklist. It takes 2 minutes, a breach takes months. |\r
| "We'll harden it before production" | Security bolted on later is always incomplete. | Build it secure now. Retrofitting misses edge cases. |\r
| "It's an internal API, no one will abuse it" | Lateral movement attacks start from internal APIs. | Internal does not mean trusted. Validate and authorize every request. |\r
| "I'll just disable CORS for development" | Dev shortcuts leak into production. | Use a proper CORS allow-list from day one. |\r
| "Engagement scoping is bureaucratic overhead" | Unscoped assessments waste time on irrelevant surface area. | Define scope once, get focused results. Opt-in only. |\r
\r
## Evidence Required\r
\r
Before claiming security review is complete, show ALL applicable:\r
\r
- [ ] Checklist above completed: each item marked pass or N/A with reason\r
- [ ] No secrets in code: \`grep -r "sk-\\|password\\s*=" --include="*.{ts,js,py}" .\` shows clean\r
- [ ] Parameterized queries used: show the query code (no string concat)\r
- [ ] Auth checks present on new endpoints: show the middleware/guard\r
- [ ] \`.env\` in \`.gitignore\`: confirmed\r
- [ ] Engagement context loaded (or confirmed absent): scope applied to findings\r
\r
**A blank checklist is not a review. Each item needs a pass or N/A.**\r
\r
## Red Flags\r
- Storing secrets in code or config files committed to git\r
- Using \`HTTP\` instead of \`HTTPS\` for sensitive data\r
- \`eval()\` or string-concatenated SQL anywhere\r
- Skipping engagement scope when \`.harness/engagement.md\` is present\r
- Reporting findings outside authorized scope as blockers (informational only)\r

\r
# Simplify — Code Simplification\r
\r
## When to Trigger\r
- File exceeds 500 lines\r
- Function exceeds 40 lines or nesting exceeds 3 levels of control flow\r
- Repeated copy-paste blocks (same shape, 2+ sites)\r
- "This is getting hard to follow" feeling\r
\r
## Process\r
\r
### 1. Measure\r
- Line count, function count, nesting depth\r
- Identify the longest/most complex function\r
\r
**Why**: You cannot improve what you cannot quantify. Baseline metrics prove simplification actually happened and prevent subjective "it feels cleaner" claims.\r
\r
### 2. Extract\r
- **Extract function**: Turn a code block into a named function\r
- **Extract constant**: Replace magic numbers/strings\r
- **Extract module**: Split large files by responsibility\r
\r
**Why**: Named abstractions replace "what does this block do?" with "what does this function promise?" — reducing cognitive load per reading unit.\r
\r
### 3. Rename\r
- Variables: describe what it holds, not how it's computed\r
- Functions: describe what it does, not how\r
- Files: match the primary export/class\r
\r
**Why**: Precise names eliminate the need for comments and make wrong code look wrong. A reader should understand intent from names alone.\r
\r
### 4. Reduce\r
- Remove dead code (unused imports, unreachable branches)\r
- Replace imperative loops with declarative (map, filter, reduce)\r
- Merge duplicate logic into shared utility\r
\r
**Why**: Every line of code is a line someone must read, understand, and maintain. Fewer lines with the same behavior means lower lifetime cost.\r
\r
### 5. Verify\r
- All tests still pass after simplification\r
- No behavior changes — only structural improvements\r
\r
**Why**: Simplification that breaks behavior is not simplification — it is a regression. Tests are the safety net that makes structural changes safe.\r
\r
## Constraints\r
- One simplification at a time — verify between each\r
- Never simplify and add features in the same change\r
\r
## Anti-Rationalization\r
\r
| Excuse | Rebuttal | What to do instead |\r
|--------|----------|-------------------|\r
| "We might need this later" | YAGNI. Code you don't need is code you maintain for free. Add it when you need it. | Delete it. When the need arises, write it with current context — not stale assumptions. |\r
| "This abstraction makes it more flexible" | Flexibility without a concrete use case is complexity. Simple code is flexible code. | Abstract only after you see the second use case. Two concrete examples beat one imagined future. |\r
| "It's already working, don't touch it" | Chesterton's Fence: understand why it exists first. But if it's needlessly complex, simplify it. | Understand it, write tests for it, then simplify it. Working code that nobody can read is a ticking bomb. |\r
\r
## Evidence Required\r
\r
Before claiming simplification is done, show ALL of these:\r
\r
- [ ] Before/after metrics: line count, function count, or nesting depth reduced\r
- [ ] All tests pass after change (show output)\r
- [ ] No behavior change: same inputs produce same outputs\r
- [ ] Each extraction is independently justified (not "because it felt cleaner")\r
\r
**"I cleaned it up" without metrics = opinion, not simplification.**\r
\r
## Red Flags\r
- Simplifying code you don't understand\r
- Over-abstracting (3 files for a 10-line utility)\r
- Mixing simplification with feature additions\r

\r

## Process\r

   - **Goal**: One sentence — what does this achieve?\r
   - **Scope**: What's included and explicitly excluded\r
   - **Requirements**: Numbered list (\`R1\`, \`R2\`, ...) of concrete, testable behaviors\r
   - **Acceptance criteria**: Numbered list (\`AC1\`, \`AC2\`, ...) — observable outcomes that prove each requirement is met\r
   - **Technical notes**: Constraints, dependencies, edge cases\r
