name: Local repair source verification
on:
  push:
    branches: [integration/local-repair]
permissions:
  contents: read
env:
  SKIP_DASHBOARD_BUILD: '1'
  CARGO_TERM_COLOR: always
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - name: Format
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Export formatting corrections
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > format.patch
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: formatting-${{ github.sha }}
          path: format.patch
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p epic-harness --all-targets -- -D warnings
      - name: Rust tests
        id: tests
        continue-on-error: true
        run: cargo test -p epic-harness
      - name: Build both executables
        run: cargo build -p epic-harness --release --bins
      - name: Node integration checks
        shell: bash
        run: |
          node --test registry/scripts/hooks/*.test.mjs
      - name: Upload commit-bound Windows executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.sha }}
          path: |
            target/release/epic.exe
            target/release/epic-harness.exe
      - name: Enforce verification results
        if: always()
        shell: bash
        run: |
          test '${{ steps.format.outcome }}' = success
          test '${{ steps.clippy.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
