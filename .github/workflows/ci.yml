name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dashboard typecheck and tests
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-check --tsconfig ./tsconfig.json
          pnpm exec vitest run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  windows-hooks:
    name: Windows hook portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Phase A — no epic on a fresh windows-latest: every hook must degrade
      # to "[harness] epic not found" + exit 0 through real cmd.exe /C.
      - name: Hook degrade contract (no harness installed)
        shell: pwsh
        env:
          PLUGIN_ROOT: ${{ github.workspace }}
        run: node examples/codex-live-check/windows-acceptance.mjs degrade
      # Install epic from the released artifact — the same bytes users get,
      # not a source build (issue #132: acceptance must exercise the release path).
      - name: Install epic from latest release artifact
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "epic-release-bin"
          & ./install.ps1 -InstallDir $installRoot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @('epic.exe', 'epic-harness.exe')) {
            $installed = Join-Path $installRoot $name
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw "$name was not installed" }
            & $installed --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Add-Content $env:GITHUB_PATH $installRoot
      # Phase B — every hook (including the session-start installer) runs
      # clean with the harness present.
      - name: Hook live pass (harness on PATH)
        shell: pwsh
        env:
          PLUGIN_ROOT: ${{ github.workspace }}
        run: node examples/codex-live-check/windows-acceptance.mjs live
      # harness-mem must start via plain PATH argv — what mcp_config.json
      # launches. Proves no `sh` anywhere in the MCP path.
      - name: harness-mem MCP handshake
        shell: pwsh
        env:
          PLUGIN_ROOT: ${{ github.workspace }}
        run: node examples/codex-live-check/windows-acceptance.mjs mcp

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
      # Registry-version scanners do not inspect path overrides. Verify the
      # exact reviewed source as well; behavioral regressions run in green-fork.
      - name: Verify reviewed Rust dependency sources
        run: |
          node scripts/check-glib-backport.mjs
          node scripts/check-sqlite-backport.mjs

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx -f json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "*.cdx.json"
